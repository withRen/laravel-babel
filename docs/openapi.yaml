        '404':
          $ref: '#/components/responses/PageInexistante'
        '422':
          $ref: '#/components/responses/AdresseRefusee'
        '429':
          $ref: '#/components/responses/TropDeRequetes'

  /lectures:
    post:
      tags: [Pages]
      operationId: lirePlusieursPages
      summary: Lire plusieurs pages en un appel
      description: |
