          $ref: '#/components/responses/ParametreRefuse'
    delete:
      tags: [Collections]
      operationId: supprimerCollection
      summary: Supprimer une collection
      description: Supprime la collection (M4). Les liens courts et les signalements qui la visent partent avec elle.
