    post:
      tags: [Annotations]
      operationId: creerAnnotation
      summary: Annoter une page
      description: |
        Annote une page, d'ici ou d'ailleurs (M6), en public ou en privé. 2 000 caractères
        au plus (règle 9). Une annotation publique est vérifiée comme tout ce qui est
        publié : si la page contient un texte banni appliqué, elle n'est pas montrée aux
        autres.
      security:
        - jetonMembre: []
      requestBody:
