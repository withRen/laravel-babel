openapi: 3.1.0

info:
  title: Bibliothèque de Babel, contrat d'API
  version: 1.1.0
  summary: Le contrat commun des 10 bibliothèques, pour le réseau et pour l'application web Angular.
  description: |
    Ce document est **le contrat d'API commun** des 10 bibliothèques. Il décrit les deux
    portes de votre serveur qui parlent JSON :

    - **la porte réseau** (`/api/v1/…`) : ce que les autres bibliothèques, la plateforme
      et le testeur de conformité appellent chez vous ;
    - **la porte application** (`/api/v1/app/…`) : ce que votre application web Angular
      appelle pour tout le reste (comptes, lecture, recherche, liens courts,
      marque-pages, collections, annotations, signalements, export).

    La troisième porte, le **back-office** de l'administrateur (stories A1 à A11), est
    servie par le serveur lui-même (livrable 4, choix 9) : elle n'est pas dans ce contrat.

    Les deux portes sont communes aux 10 bibliothèques : n'importe quelle application
    Angular écrite contre ce contrat fonctionne avec n'importe quel serveur qui le
    respecte. Une réponse qui s'en écarte, même d'un nom de champ, compte comme un échec.

    Il découle du cahier des charges final (livrables 1 à 4) et du moteur
    `but-mmi-beziers/babel-moteur` (v1.0.1). Les numéros entre parenthèses renvoient aux
    stories (V…, M…, A…, B…) et aux fonctions (F1 à F8).

    ## Règles communes

    1. **Adresse de base** : toutes les routes sont servies sous `/api/v1`.
    2. **JSON en UTF-8** : `Content-Type: application/json` dans les deux sens. Les noms
       de champs sont en français, en minuscules, avec des tirets bas. Une réponse ne
       contient que les champs prévus, tous présents (une valeur absente vaut `null`).
    3. **La porte réseau est ouverte en lecture** : aucune route ne demande de compte.
       Une autre bibliothèque voit ce qu'un visiteur voit. Seule `GET /textes-bannis`
       exige le jeton réseau. Le réseau ne transporte aucune écriture.
    4. **La porte application** distingue le visiteur (sans jeton) et le membre (jeton
       de session dans `Authorization: Bearer …`, obtenu à la connexion). Une route
       marquée « membre » répond `401` sans jeton valide. Une route ouverte aux visiteurs
       accepte aussi le jeton d'un membre et en tient compte.
    5. **Deux secondes** : un pair a 2 secondes pour répondre. Au-delà, l'appelant
       compte un échec.
    6. **Limite de débit** (A10) : chaque bibliothèque choisit son quota, mais accepte
       **au moins 60 requêtes par minute et par adresse IP appelante** sur la porte
       réseau. Au-delà, elle répond `429` avec l'en-tête `Retry-After` et le code
       `ERR_TOO_MANY_REQUESTS`. Un `429` n'est pas un échec : le pair est en ligne mais
       occupé. La même limite protège les actions sans compte de la porte application :
       liens courts, signalements, recherches sur le réseau.
    7. **Une adresse ne se corrige pas** : elle est acceptée telle quelle ou refusée.
       Pas de `trim()`, pas de passage en minuscules.
    8. **Toujours normaliser avant le moteur**, même quand la recherche vient d'un pair
       (règle F3 ci-dessous).
    9. **Les listes** sont découpées en lots : paramètres `lot` (à partir de 1) et
       `taille` (1 à 50, 20 par défaut), réponse `{ lot, taille, total, elements }`.
    10. **Les identifiants** de ressources (collection, annotation, marque-page…) sont
        renvoyés **en chaîne** : `"12"`, pas `12`.

    ## Une page d'ici ou d'ailleurs

    Une page désignée par la porte application porte toujours sa bibliothèque : une
    adresse ne veut rien dire sans elle, puisque chaque bibliothèque a sa clé. Les routes
    qui reçoivent une adresse acceptent un paramètre ou un champ `bibliotheque` :
    absent, il désigne la bibliothèque locale. Une page d'une autre bibliothèque (M13,
    V16, V21) est lue chez elle par votre serveur, jamais par l'application web.

    ## La forme des erreurs

    Toute erreur, quelle que soit la route, a la même forme : un objet avec une liste
    `erreurs`, chaque erreur portant un `code`, un `champ` (ou `null`) et un `message`
    lisible. C'est exactement ce que renvoie `ErreurMoteur::versTableau()` :

    ```json
    { "erreurs": [ { "code": "ERR_OUT_OF_BOUNDS", "champ": "mur", "message": "Le mur doit être compris entre 1 et 4." } ] }
    ```

    Le `code` et le `champ` font partie du contrat, le `message` non. Les erreurs de
    validation d'un corps de requête sont toutes renvoyées d'un coup, une par champ.

    | Situation | Statut |
    | --- | --- |
    | au moins une erreur de forme (adresse mal écrite, recherche refusée, champ invalide) | `422` |
    | la liste ne contient **que** des `ERR_OUT_OF_BOUNDS` : l'adresse est bien écrite, la page n'existe pas | `404` |
    | ressource inconnue, privée, masquée ou appartenant à un autre membre | `404` |
    | lien court expiré | `410` |
    | pas connecté, jeton de session ou jeton réseau invalide, identifiants faux | `401` |
    | compte suspendu, inscriptions fermées | `403` |
    | doublon (email déjà pris, page déjà en marque-page…) | `409` |
    | quota dépassé | `429` |
    | pair injoignable, trop lent ou hors contrat | `502` |
    | pair occupé (il a répondu `429`) | `503` |

    Une `CleInvalide` du moteur (clé absente ou mal formée) est une erreur
    d'installation : elle remonte en `500`, on ne la déguise pas en `422`. La ressource
    d'un autre membre répond `404` et non `403`, pour ne rien laisser deviner.

    ## La normalisation (F3)

    La règle est commune à toutes les bibliothèques : sans elle, la même phrase ne
    donne pas le même texte cherché d'une bibliothèque à l'autre.

    1. passer en minuscules ;
    2. retirer les accents et la cédille (é → e, ç → c), développer les lettres liées
       (œ → oe, æ → ae) ;
    3. remplacer tout caractère hors des 29 symboles par une espace, saut de ligne compris ;
    4. réduire les espaces qui se suivent à une seule ;
    5. retirer les espaces du début et de la fin.

    En modes `exact` et `bruit`, on applique les 5 étapes. En mode `page`, on s'arrête
    à l'étape 3 : une page contient des espaces doubles et des espaces en bord, les
    retirer en ferait un autre texte.
    Exemple : `Où est passé l'été ?` devient `ou est passe l ete`.

    ## Ce qui reste dans l'application web

    Trois fonctions n'ont pas de route, parce qu'elles s'exécutent dans le navigateur
    (livrable 2) : `localiser` (F4, surligner le texte cherché, V7), `voisine` (F6, page
    précédente ou suivante, V2 et V3 ; `GET /app/infos` donne le dernier hexagone pour
    détecter `ERR_LIBRARY_LIMIT`) et la copie d'une adresse ou d'un lien (V10). La liste
    des contenus qu'un visiteur a signalés (V18) reste aussi dans son navigateur.

    ## Où trouver chaque story

    | Stories | Routes |
    | --- | --- |
    | V1, V16, M13 | `GET /app/pages/{adresse}` (avec `bibliotheque` pour une page d'ailleurs) |
    | V2, V3, V7, V10 | dans l'application web (F6, F4), aidée par `GET /app/infos` |
    | V4, V5, V6, M8 | `POST /app/recherches` |
    | V8 | toutes les routes : erreurs `ERR_…` |
    | V9 | `GET /app/hasard` |
    | V11, V12 | `POST /app/liens-courts`, `GET /app/liens-courts/{slug}` |
    | V13, V21 | `GET /app/bibliotheques/{identifiant}/collections`, `…/pages-populaires` |
    | V14 | `GET /app/pages/{adresse}` (champ `annotations`) |
    | V15 | `POST /app/recherches-reseau`, canal temps réel, `GET /app/recherches-reseau/{identifiant}` |
    | V17, V18 | `POST /app/signalements`, `GET /app/moi/signalements` |
    | V19, M1 | `POST /app/auth/inscription`, `/connexion`, `/deconnexion`, `GET /app/moi` |
    | V20, A8 | `GET /app/infos` |
    | M2, M3 | `/app/moi/marque-pages` |
    | M4, M5 | `/app/moi/collections` |
    | M6 | `/app/moi/annotations` |
    | M7 | `PUT` et `DELETE /app/pages/{adresse}/vote`, `GET /app/moi/votes` |
    | M9, M10 | `PATCH` et `DELETE /app/moi` |
    | M11, M12 | `GET /app/moi/export`, `POST` et `GET /app/moi/import` |
    | A1 à A5, A7, A11 | back-office, hors contrat |
    | A6, B5 | `GET /textes-bannis` (jeton réseau) |
    | A9 | back-office ; vue publique dans `GET /app/bibliotheques` |
    | A10 | `429` sur toutes les routes |
    | B1 | `GET /pages/{adresse}`, `POST /lectures` |
    | B2 | `POST /recherches` |
    | B3, B4 | `GET /collections`, `GET /collections/{id}`, `GET /pages-populaires` |
    | B6 | `GET /identite` |

    ## Pièges de Laravel à connaître

    - **`TrimStrings`** : ce middleware, actif par défaut, retire les espaces en bord de
      chaque champ. Il casse le mode `page` (3 200 caractères exactement) et le passage
      d'un lien court, et modifie les mots de passe. Excluez ces champs :
      `$middleware->trimStrings(except: ['texte', 'passage', 'mot_de_passe', 'mot_de_passe_actuel'])`
      dans `bootstrap/app.php`.
    - **`ConvertEmptyStringsToNull`** : un champ vide arrive en `null`. Un `texte` vide
      doit donner `ERR_EMPTY_QUERY`, et une `description` vide se renvoie `""`, pas `null`.
    - **Contrainte de route** : ne mettez pas de `->where('adresse', …)` sur les routes
      `{adresse}`. Une adresse refusée doit recevoir une erreur du contrat, pas la page
      404 HTML de Laravel. Déclarez `/app/hasard` avant les routes `{adresse}`.
    - **Limite de débit** : la réponse `429` par défaut de Laravel n'a pas la forme du
      contrat. Personnalisez-la (`RateLimiter::for(...)->response(...)`).
    - **Validation** : `$request->validate()` répond `{"message": …, "errors": …}`.
      Traduisez ses erreurs en `ERR_INVALID_PARAMETER`, une par champ.
    - **Sanctum** : utilisez les jetons d'API (`createToken()`), pas les cookies de
      session. Le jeton part dans `Authorization: Bearer …` à chaque appel.
    - **CORS** : l'application Angular (`localhost:4200`) n'a pas la même origine que le
      serveur (`localhost:8000`). Autorisez-la dans `config/cors.php` pour `api/*`.
    - **Erreurs non prévues** : une route inconnue ou une exception doit aussi répondre
      en JSON (`Accept: application/json`, ou `shouldRenderJsonWhen` dans
      `bootstrap/app.php`).

