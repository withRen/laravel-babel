  /recherches:
    post:
      tags: [Pages]
      operationId: chercher
      summary: Chercher un texte
      description: |
        Renvoie l'adresse d'une page qui contient le texte (F2, B2). C'est la route que
        les pairs appellent pendant une recherche sur tout le réseau (V15).

        Le serveur **normalise** le texte (F3) avant d'appeler le moteur, puis renvoie le
        texte normalisé avec l'adresse : l'appelant montre ainsi ce qui a réellement été
        cherché (V6). La position du texte dans la page n'est pas renvoyée : l'appelant la
        calcule lui-même (F4).

        Même texte et même mode donnent toujours la même adresse dans une bibliothèque,
        y compris en mode `bruit`. Rien n'est enregistré.

        Les contrôles se font dans cet ordre et s'arrêtent à la première erreur : mode,
        puis texte vide, puis longueur. Un champ `mode` absent donne `ERR_UNKNOWN_MODE`,
        un champ `texte` absent ou `null` donne `ERR_EMPTY_QUERY`. `ERR_INVALID_ALPHABET`
        ne doit jamais sortir : le texte est normalisé avant le moteur.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemandeRecherche'
            examples:
              phrase:
                summary: Une phrase quelconque, en mode exact
                value:
                  texte: Où est passé l'été ?
                  mode: exact
      responses:
        '200':
          description: L'adresse trouvée. La recherche réussit toujours quand le texte est accepté.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultatRecherche'
              examples:
                cleDeTestA:
                  summary: Résultat avec la clé de test A
                  value:
                    bibliotheque: exemple
                    texte_normalise: ou est passe l ete
                    mode: exact
                    adresse: -w2-s1-v16:352
        '422':
          $ref: '#/components/responses/RechercheRefusee'
        '429':
          $ref: '#/components/responses/TropDeRequetes'

  /collections:
    get:
      tags: [Découverte]
      operationId: listerCollections
      summary: Lister les collections publiques
      description: |
        Les collections publiques et non masquées de vos membres (B3), de la plus
        récemment modifiée à la plus ancienne. Le détail, avec les pages, est sur
        `GET /collections/{id}`.

        Une collection privée ou masquée n'apparaît pas. L'auteur n'est pas publié.
      parameters:
        - $ref: '#/components/parameters/Lot'
        - $ref: '#/components/parameters/Taille'
      responses:
        '200':
          description: Un lot de collections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListeCollections'
              examples:
                unLot:
                  value:
                    lot: 1
                    taille: 20
                    total: 1
                    elements:
                      - id: '12'
                        nom: Les premières pages
                        description: Le tout début de la bibliothèque.
                        nombre_pages: 2
                        maj_le: '2026-11-20T14:05:00+01:00'
        '422':
          $ref: '#/components/responses/ParametreRefuse'
        '429':
          $ref: '#/components/responses/TropDeRequetes'

  /collections/{id}:
    get:
      tags: [Découverte]
      operationId: lireCollection
      summary: Lire une collection publique
      description: |
        Une collection publique, avec ses pages dans l'ordre (B3). Chaque page porte
        l'identifiant de sa bibliothèque : le plus souvent la vôtre, parfois une autre
        (M13). L'appelant lit chaque page chez la bibliothèque indiquée (B1).

        Une page marquée par un de vos textes bannis appliqués n'est pas montrée : elle
        est retirée de la liste, les autres gardent leur position. Une collection privée,
        masquée ou inexistante reçoit la même réponse `404`, pour ne rien laisser deviner.
      parameters:
        - $ref: '#/components/parameters/IdChemin'
      responses:
        '200':
          description: La collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
              examples:
                deuxPages:
                  value:
                    id: '12'
                    nom: Les premières pages
                    description: Le tout début de la bibliothèque.
                    nombre_pages: 2
                    maj_le: '2026-11-20T14:05:00+01:00'
                    pages:
                      - position: 1
                        bibliotheque: exemple
                        adresse: 0-w1-s1-v1:1
                      - position: 2
                        bibliotheque: exemple
                        adresse: 0-w1-s1-v1:2
        '404':
          $ref: '#/components/responses/Introuvable'
        '429':
          $ref: '#/components/responses/TropDeRequetes'

  /pages-populaires:
    get:
      tags: [Découverte]
      operationId: listerPagesPopulaires
      summary: Pages les plus populaires
      description: |
        Les pages les plus populaires chez vous (B4), de la plus populaire à la moins
        populaire. Le `score` est un total anonyme calculé à partir des votes et des
        marque-pages ; chaque bibliothèque choisit sa formule, mais ne montre jamais qui
        a voté ou gardé la page.

        Une page marquée par un de vos textes bannis appliqués n'apparaît pas.
      parameters:
        - $ref: '#/components/parameters/Taille'
      responses:
        '200':
          description: Les pages les plus populaires, au plus `taille`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListePagesPopulaires'
              examples:
                deuxPages:
                  value:
                    elements:
                      - bibliotheque: exemple
                        adresse: babel-w2-s3-v17:204
                        score: 14
                      - bibliotheque: voisine
                        adresse: 0-w1-s1-v1:1
                        score: 9
        '422':
          $ref: '#/components/responses/ParametreRefuse'
        '429':
          $ref: '#/components/responses/TropDeRequetes'

  /textes-bannis:
    get:
      tags: [Modération]
      operationId: releverTextesBannis
      summary: Relever les textes bannis (jeton réseau)
      description: |
        Les textes que **vous** avez bannis vous-même et qui sont appliqués (A6, B5).
        Les pairs les relèvent régulièrement, les cherchent chez eux et décident de les
        appliquer ou non (A7).

        **Cette route exige le jeton réseau**, dans l'en-tête
        `Authorization: Bearer <jeton réseau>`. Sans lui, la liste n'est pas lisible :
        c'est la seule route de la porte réseau qui n'est pas ouverte aux visiteurs.
        Aucune route de la porte application ne la redonne.

        - Ne figurent que les textes d'origine locale au statut `applique`. Un texte relevé
          chez un pair n'est jamais republié, même appliqué chez vous. Un bannissement
          levé (`rejete`) disparaît de la liste.
        - Le jeton se compare en temps constant (`hash_equals`), ne s'écrit dans aucun
          journal et ne va pas en base : il est dans la configuration du serveur.
        - Jeton absent, mal formé ou faux : même réponse `401`, sans dire lequel.
        - La réponse porte `Cache-Control: no-store`.
      security:
        - jetonReseau: []
      responses:
        '200':
          description: Vos textes bannis appliqués.
          headers:
            Cache-Control:
              description: Toujours `no-store`.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListeTextesBannis'
              examples:
                unTexte:
                  value:
                    elements:
                      - texte: ou est passe l ete
                        empreinte: 91faae8c40f78510e024c03c008bb0761800f1e3fbf168ea48e300d4ba299164
                        motif: Exemple de démonstration.
                        banni_le: '2026-11-20T14:05:00+01:00'
        '401':
          description: Jeton réseau absent, mal formé ou faux.
          headers:
            WWW-Authenticate:
              description: Toujours `Bearer`.
              schema:
                type: string
                const: Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReponseErreur'
              examples:
                sansJeton:
                  value:
                    erreurs:
                      - code: ERR_INVALID_NETWORK_TOKEN
                        champ: null
                        message: Cette route est réservée aux bibliothèques du réseau.
        '429':
          $ref: '#/components/responses/TropDeRequetes'

