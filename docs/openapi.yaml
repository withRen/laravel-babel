          description: La collection est supprimée.
        '401':
          $ref: '#/components/responses/NonConnecte'
        '404':
          $ref: '#/components/responses/Introuvable'

  /app/moi/collections/{id}/pages:
    post:
      tags: [Collections]
      operationId: ajouterPageCollection
      summary: Ranger une page dans une collection
      description: |
        Ajoute une page, d'ici ou d'ailleurs (M4, M13). Sans `position`, elle va à la fin ;
        avec, elle s'insère à cette position et décale les suivantes. Une même page peut
        revenir plusieurs fois (règle 8). Dans une collection publique, la page est
        vérifiée contre les textes bannis appliqués.
      security:
        - jetonMembre: []
      parameters:
        - $ref: '#/components/parameters/IdChemin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemandeAjoutPage'
      responses:
        '200':
          description: La collection, avec la page ajoutée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaCollection'
        '401':
          $ref: '#/components/responses/NonConnecte'
        '404':
          $ref: '#/components/responses/PageInexistanteApp'
        '422':
          $ref: '#/components/responses/AdresseRefusee'
    put:
      tags: [Collections]
      operationId: ordonnerPagesCollection
      summary: Réordonner les pages d'une collection
      description: |
        Remplace la liste des pages par celle envoyée, dans cet ordre (M4) : c'est ainsi
        qu'on réordonne par glisser-déposer. Les positions sont renumérotées à partir de 1.
      security:
        - jetonMembre: []
      parameters:
        - $ref: '#/components/parameters/IdChemin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemandeOrdrePages'
      responses:
        '200':
          description: La collection réordonnée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaCollection'
        '401':
          $ref: '#/components/responses/NonConnecte'
        '404':
          $ref: '#/components/responses/Introuvable'
        '422':
          $ref: '#/components/responses/AdresseRefusee'

  /app/moi/collections/{id}/pages/{position}:
    delete:
