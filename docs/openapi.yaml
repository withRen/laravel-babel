  # ------------------------------------------------------------------
  # Porte application : recherche
  # ------------------------------------------------------------------

  /app/recherches:
    post:
      tags: [Recherche]
      operationId: chercherApp
      summary: Chercher un texte dans la bibliothèque
      description: |
        Même traitement que `POST /recherches` (F3 puis F2, V4, V5, V6). Pour un membre
        connecté, la recherche est en plus enregistrée dans son historique (M8, portée
        `locale`). Pour un visiteur, elle ne laisse qu'un compteur (règle 12).

        L'application web lit ensuite la page avec `GET /app/pages/{adresse}`, puis
        surligne `texte_normalise` avec `localiser` (F4, V7).
      security:
        - {}
        - jetonMembre: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemandeRecherche'
      responses:
        '200':
          description: L'adresse trouvée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultatRecherche'
        '422':
          $ref: '#/components/responses/RechercheRefusee'
        '429':
          $ref: '#/components/responses/TropDeRequetes'

  /app/recherches-reseau:
    post:
      tags: [Recherche]
      operationId: lancerRechercheReseau
      summary: Lancer une recherche sur tout le réseau
      description: |
        Lance la recherche sur toutes les bibliothèques en ligne (V15), selon le
        déroulé du livrable 4 :

        1. l'application web tire un `identifiant` (UUID v4) et s'abonne au canal
           `recherche-reseau.{identifiant}` (voir « Temps réel ») ;
        2. elle appelle cette route ;
        3. le serveur normalise le texte, cherche chez lui, dépose une tâche par pair en
           ligne et **répond tout de suite** (`202`) avec le résultat local et la liste
           des pairs interrogés ;
        4. chaque tâche appelle `POST /recherches` chez son pair (2 secondes au plus),
           vérifie la réponse contre le contrat et publie un événement `resultat` ;
        5. quand toutes les tâches sont finies, le serveur publie `terminee`.

        Un pair déjà hors ligne n'est pas interrogé : il figure dans `absents`. Pour un
        membre, la recherche est enregistrée dans son historique (portée `reseau`).
        L'état de la recherche reste lisible au moins 10 minutes sur
        `GET /app/recherches-reseau/{identifiant}`.
      security:
        - {}
        - jetonMembre: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemandeRechercheReseau'
            examples:
              phrase:
                value:
                  identifiant: 3f2c8a1e-6b7d-4c1a-9e2f-0a1b2c3d4e5f
                  texte: Où est passé l'été ?
                  mode: exact
      responses:
        '202':
          description: La recherche est lancée ; les résultats des pairs arrivent par le canal temps réel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RechercheReseauLancee'
              examples:
                lancee:
                  value:
                    identifiant: 3f2c8a1e-6b7d-4c1a-9e2f-0a1b2c3d4e5f
                    texte_normalise: ou est passe l ete
                    mode: exact
                    locale:
                      bibliotheque: exemple
                      adresse: -w2-s1-v16:352
                    interroges: [voisine, lointaine]
                    absents: [eteinte]
                    delai_pair_ms: 2000
                    canal: recherche-reseau.3f2c8a1e-6b7d-4c1a-9e2f-0a1b2c3d4e5f
        '409':
          $ref: '#/components/responses/Doublon'
        '422':
          $ref: '#/components/responses/RechercheRefusee'
        '429':
          $ref: '#/components/responses/TropDeRequetes'

  /app/recherches-reseau/{identifiant}:
    get:
      tags: [Recherche]
      operationId: lireRechercheReseau
      summary: État d'une recherche réseau
      description: |
        L'état d'une recherche réseau et les résultats déjà arrivés. L'application web
        s'en sert pour rattraper un résultat manqué, après un rechargement, ou à la place
        du temps réel en interrogeant régulièrement. Le serveur garde cet état en cache
        (pas en base) au moins 10 minutes.
      security:
        - {}
        - jetonMembre: []
      parameters:
        - name: identifiant
          in: path
          required: true
          description: L'identifiant tiré par l'application web au lancement.
          schema:
            $ref: '#/components/schemas/IdentifiantRecherche'
      responses:
        '200':
          description: L'état de la recherche.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtatRechercheReseau'
              examples:
                enCours:
                  value:
                    identifiant: 3f2c8a1e-6b7d-4c1a-9e2f-0a1b2c3d4e5f
                    texte_normalise: ou est passe l ete
                    mode: exact
                    etat: en_cours
                    locale:
                      bibliotheque: exemple
                      adresse: -w2-s1-v16:352
                    interroges: [voisine, lointaine]
                    absents: [eteinte]
                    resultats:
                      - bibliotheque: voisine
                        statut: trouve
                        adresse: babel-w2-s3-v17:204
                        texte_normalise: ou est passe l ete
                        recu_le: '2026-11-20T14:05:01+01:00'
                    lancee_le: '2026-11-20T14:05:00+01:00'
        '404':
          $ref: '#/components/responses/Introuvable'
        '429':
          $ref: '#/components/responses/TropDeRequetes'

  # ------------------------------------------------------------------
  # Porte application : liens courts
  # ------------------------------------------------------------------

  /app/liens-courts:
    post:
      tags: [Liens courts]
      operationId: creerLienCourt
      summary: Créer un lien court
      description: |
        Crée un lien court vers une page, un livre entier ou une collection, avec au
        besoin un passage à surligner (V11). Ouvert aux visiteurs.

        - La cible est une adresse de page ou de livre (avec sa bibliothèque), ou une
          collection publique de cette bibliothèque (ou une collection du membre).
        - `passage` ne va qu'avec une page. C'est le texte d'une recherche ou un extrait
          de la page repris tel quel, espaces comprises. Le serveur vérifie qu'il figure
          dans la page (`localiser`), sinon `ERR_INVALID_PARAMETER` sur `passage`.
        - Sans compte, le lien expire obligatoirement : `expire_le` absent vaut la durée
          maximale (`GET /app/infos`, `limites.duree_lien_visiteur_jours`), au-delà il est
          refusé. Un membre peut créer un lien sans expiration (`expire_le` absent ou `null`).
        - Comme tout ce qui est publié, la page visée est vérifiée contre les textes
          bannis appliqués (livrable 3). Si elle en contient un, le lien est créé mais ne
          s'ouvrira pas pour les autres.

        L'application web construit l'URL à partager (`https://…/l/{slug}`) et le QR code.
      security:
        - {}
        - jetonMembre: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemandeLienCourt'
            examples:
              pageAvecPassage:
                value:
                  cible:
                    type: adresse
                    bibliotheque: exemple
                    adresse: 0-w1-s1-v1:1
                  passage: olonj
                  expire_le: null
              collection:
                value:
                  cible:
                    type: collection
                    id: '12'
      responses:
        '201':
          description: Le lien est créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LienCourt'
        '404':
          $ref: '#/components/responses/PageInexistanteApp'
        '422':
          $ref: '#/components/responses/ParametreRefuse'
        '429':
          $ref: '#/components/responses/TropDeRequetes'

  /app/liens-courts/{slug}:
    get:
      tags: [Liens courts]
      operationId: ouvrirLienCourt
      summary: Ouvrir un lien court
      description: |
        Résout un lien court (V12) et compte une visite. Pour un livre entier,
        `adresse_a_ouvrir` donne sa page 1. Pour une collection, la collection est
        renvoyée entière, pages filtrées comme sur `GET /collections/{id}`.

        Un lien inconnu, masqué, ou dont la cible est masquée (collection masquée ou
        devenue privée, page qui contient un texte banni appliqué) répond `404`. Un lien
        expiré répond `410 ERR_SHORT_LINK_EXPIRED`.
      security:
        - {}
        - jetonMembre: []
      parameters:
        - $ref: '#/components/parameters/SlugChemin'
      responses:
        '200':
          description: La cible du lien.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LienCourtOuvert'
              examples:
                livre:
                  summary: Un lien vers un livre entier
                  value:
                    slug: k7Hq2x
                    cible:
                      type: adresse
                      bibliotheque: exemple
                      adresse: babel-w2-s3-v17
                      niveau: livre
                      adresse_a_ouvrir: babel-w2-s3-v17:1
                    passage: null
                    expire_le: '2026-12-20T14:05:00+01:00'
        '404':
          $ref: '#/components/responses/Introuvable'
        '410':
          $ref: '#/components/responses/LienExpire'
        '429':
          $ref: '#/components/responses/TropDeRequetes'

  /app/moi/liens-courts:
    get:
      tags: [Liens courts]
      operationId: listerMesLiensCourts
      summary: Mes liens courts
      description: Les liens courts créés par le membre connecté, du plus récent au plus ancien, avec leur nombre de visites.
      security:
        - jetonMembre: []
      parameters:
        - $ref: '#/components/parameters/Lot'
        - $ref: '#/components/parameters/Taille'
