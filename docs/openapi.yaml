      description: |
        Change le pseudo, l'email ou le mot de passe (M9). Seuls les champs envoyés
        changent. Changer l'email ou le mot de passe demande le mot de passe actuel
        (`mot_de_passe_actuel`) : faux, il donne `401 ERR_INVALID_CREDENTIALS`. Un email
        déjà pris donne `409 ERR_ALREADY_EXISTS`.
      security:
        - jetonMembre: []
      requestBody:
        required: true
        content:
