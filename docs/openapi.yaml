          description: L'historique est vide.
        '401':
          $ref: '#/components/responses/NonConnecte'

  /app/moi/recherches/{id}:
    delete:
      tags: [Historique et données]
      operationId: supprimerMaRecherche
      summary: Effacer une recherche
      description: Efface une recherche de l'historique du membre.
      security:
        - jetonMembre: []
      parameters:
        - $ref: '#/components/parameters/IdChemin'
      responses:
        '204':
          description: La recherche est effacée.
