      description: |
        Supprime le compte et ses données (M10, règle 19 du livrable 3) : marque-pages,
        collections, annotations, votes, recherches et liens courts. Ses signalements
        restent, sans auteur. Toutes ses sessions sont fermées.

        Demande le mot de passe dans le corps de la requête, par sécurité. Avec Angular :
        `http.delete(url, { body: { mot_de_passe } })`.
      security:
        - jetonMembre: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemandeSuppressionCompte'
      responses:
        '204':
          description: Le compte est supprimé.
        '401':
          $ref: '#/components/responses/NonConnecte'
        '422':
          $ref: '#/components/responses/ParametreRefuse'

