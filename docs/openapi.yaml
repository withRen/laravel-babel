servers:
  - url: '{base}/api/v1'
    description: Votre bibliothèque (en local, ou derrière ngrok)
    variables:
      base:
        default: http://localhost:8000
        description: L'URL publique de votre serveur, sans barre finale.

security: []

tags:
  - name: Identité
    description: Qui êtes-vous, et votre clé a-t-elle changé ? (B6, A9)
  - name: Pages
    description: Lire des pages et chercher un texte, pour les autres bibliothèques (B1, B2).
  - name: Découverte
    description: Ce que vos membres ont publié, pour les autres bibliothèques (B3, B4).
  - name: Modération
    description: Les textes que vous avez bannis, réservés au réseau (B5, A6).
  - name: Bibliothèque et réseau
    description: La configuration de la bibliothèque pour l'application web, et ce que l'on sait des pairs (V13, V20, V21, A8).
  - name: Comptes
    description: Inscription, connexion, profil, suppression (V19, M1, M9, M10).
  - name: Lecture
    description: Lire une page d'ici ou d'ailleurs, avec ce que les membres y ont laissé ; page au hasard ; votes (V1, V9, V14, V16, M7, M13).
  - name: Recherche
    description: Chercher ici (V4, V5, V6, M8) ou sur tout le réseau (V15).
  - name: Liens courts
    description: Créer et ouvrir un lien court (V11, V12).
  - name: Marque-pages
    description: Les marque-pages du membre (M2, M3, M13).
  - name: Collections
    description: Les collections du membre (M4, M5).
  - name: Annotations
    description: Les annotations du membre (M6).
  - name: Signalements
    description: Signaler un contenu publié (V17, V18).
  - name: Historique et données
    description: Recherches passées, votes, export et import du compte (M7, M8, M11, M12).
  - name: Temps réel
    x-displayName: Temps réel (recherche réseau)
    description: |
      Pendant une recherche sur tout le réseau (V15), le serveur temps réel pousse à
      l'application web le résultat de chaque pair dès qu'il arrive (livrable 4).

      **Déroulé.** L'application web tire un identifiant (UUID v4), **s'abonne d'abord**
      au canal public `recherche-reseau.{identifiant}`, puis appelle
      `POST /app/recherches-reseau`. S'abonner avant de lancer évite de perdre le
      résultat d'un pair très rapide.

      **Protocole.** Celui de Pusher, que parlent Laravel Reverb et Laravel Echo. Les
      paramètres de connexion sont dans `GET /app/infos`, champ `temps_reel`. Canal public
      (l'identifiant est impossible à deviner), deux événements :

      | Événement (`broadcastAs`) | Quand | Contenu |
      | --- | --- | --- |
      | `resultat` | un pair a répondu, ou a échoué | `EvenementResultat` |
      | `terminee` | toutes les tâches sont finies | `EvenementTerminee` |

      ```ts
      echo.channel(`recherche-reseau.${id}`)
        .listen('.resultat', (e) => …)
        .listen('.terminee', (e) => …);
      ```

      **Sans temps réel.** `GET /app/recherches-reseau/{identifiant}` renvoie à tout
      moment l'état de la recherche et les résultats déjà arrivés. Une application web
      peut s'en servir en interrogeant toutes les 500 ms, avant de passer au WebSocket.

      <SchemaDefinition schemaRef="#/components/schemas/EvenementResultat" />

      <SchemaDefinition schemaRef="#/components/schemas/EvenementTerminee" />
  - name: Fichier d'export
    x-displayName: Fichier d'export (M11, M12)
    description: |
      Le fichier qu'un membre télécharge chez une bibliothèque (`GET /app/moi/export`,
      M11) et dépose chez une autre (`POST /app/moi/import`, M12). Toutes les
      bibliothèques doivent savoir lire le fichier des autres : son format fait partie
      du contrat.

      <SchemaDefinition schemaRef="#/components/schemas/ExportCompte" />

x-tagGroups:
  - name: Porte réseau (entre bibliothèques)
    tags: [Identité, Pages, Découverte, Modération]
  - name: Porte application (application web Angular)
    tags: [Bibliothèque et réseau, Comptes, Lecture, Recherche, Liens courts, Marque-pages, Collections, Annotations, Signalements, Historique et données]
  - name: Formats communs
    tags: [Temps réel, Fichier d'export]

paths:
  /identite:
    get:
      tags: [Identité]
      operationId: lireIdentite
      summary: Identité de la bibliothèque
      description: |
        Renvoie l'identifiant, le nom, la description et l'empreinte de la clé (B6).

        La plateforme lit cette route pour vérifier qu'une bibliothèque est présente.
        Les pairs la lisent régulièrement et gardent l'empreinte : si elle change, les
        adresses enregistrées vers cette bibliothèque ne désignent plus les mêmes textes,
        et l'état du réseau le signale (A9).

        L'empreinte est celle que donne `$moteur->empreinte()`, telle quelle.
      responses:
        '200':
          description: L'identité de la bibliothèque.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identite'
              examples:
                cleDeTestA:
                  summary: Une bibliothèque qui utilise la clé de test A
                  value:
                    identifiant: exemple
                    nom: La bibliothèque d'exemple
                    description: Une bibliothèque de démonstration, avec la clé de test A du moteur.
                    empreinte_cle: f85a8e8ae6a8a1ceb96d8884d2d45c00c3cc73c95e1bdf4e5cba35664bb0c637
                    algorithme: babel-moteur/v1
                    contrat: 1.1.0
                    application_web: http://localhost:4200
        '429':
          $ref: '#/components/responses/TropDeRequetes'

  /pages/{adresse}:
    get:
      tags: [Pages]
      operationId: lirePage
      summary: Lire une page
      description: |
        Renvoie le texte de la page à cette adresse (F1, B1) : exactement 3 200
        caractères pris parmi les 29 symboles.

        La page est toujours lisible, même si elle contient un texte banni : on ne masque
        jamais une page. Une adresse de livre (sans `:<page>`) est refusée
        (`ERR_INVALID_ADDRESS_SYNTAX`, champ `page`).

        Toutes les erreurs de l'adresse sont renvoyées d'un coup, dans l'ordre hexagone,
        mur, étagère, volume, page : c'est ce que fait déjà le moteur.

        L'application web n'utilise pas cette route mais `GET /app/pages/{adresse}`, qui
        ajoute ce que les membres ont laissé sur la page.
      parameters:
        - $ref: '#/components/parameters/AdresseChemin'
      responses:
        '200':
          description: La page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
              examples:
                cleDeTestA:
                  summary: La page 0-w1-s1-v1:1 avec la clé de test A
