        '401':
          $ref: '#/components/responses/NonConnecte'
        '404':
          $ref: '#/components/responses/Introuvable'

  # ------------------------------------------------------------------
  # Porte application : marque-pages
  # ------------------------------------------------------------------

  /app/moi/marque-pages:
    get:
      tags: [Marque-pages]
      operationId: listerMarquePages
      summary: Mes marque-pages
      description: |
        Les marque-pages du membre, du plus récent au plus ancien (M3). Filtres
        facultatifs : une bibliothèque, ou un livre (tous les marque-pages d'un même
        livre, grâce à `empreinte_livre`, règle 3).
      security:
        - jetonMembre: []
      parameters:
        - $ref: '#/components/parameters/Lot'
        - $ref: '#/components/parameters/Taille'
        - name: bibliotheque
          in: query
          required: false
          description: Ne garder que les pages de cette bibliothèque.
          schema:
            $ref: '#/components/schemas/IdentifiantBibliotheque'
        - name: livre
          in: query
          required: false
          description: Ne garder que les pages de ce livre (adresse sans `:<page>`).
          schema:
            type: string
      responses:
        '200':
          description: Un lot de marque-pages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListeMarquePages'
        '401':
          $ref: '#/components/responses/NonConnecte'
        '422':
          $ref: '#/components/responses/ParametreRefuse'
    post:
      tags: [Marque-pages]
      operationId: creerMarquePage
      summary: Garder une page en marque-page
      description: |
        Garde une page, d'ici ou d'une autre bibliothèque (M2, M13), avec un titre
        facultatif. Une page ne se garde qu'une fois par membre (règle 7) : la deuxième
        fois donne `409 ERR_ALREADY_EXISTS`. Seule une adresse de page est acceptée.
      security:
        - jetonMembre: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemandeMarquePage'
      responses:
        '201':
          description: Le marque-page est créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarquePage'
        '401':
          $ref: '#/components/responses/NonConnecte'
        '404':
          $ref: '#/components/responses/PageInexistanteApp'
        '409':
          $ref: '#/components/responses/Doublon'
        '422':
          $ref: '#/components/responses/AdresseRefusee'

  /app/moi/marque-pages/{id}:
    patch:
      tags: [Marque-pages]
      operationId: modifierMarquePage
      summary: Renommer un marque-page
      description: Change le titre d'un marque-page (`null` le retire).
      security:
        - jetonMembre: []
      parameters:
        - $ref: '#/components/parameters/IdChemin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModificationMarquePage'
      responses:
        '200':
          description: Le marque-page modifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarquePage'
        '401':
          $ref: '#/components/responses/NonConnecte'
        '404':
          $ref: '#/components/responses/Introuvable'
        '422':
          $ref: '#/components/responses/ParametreRefuse'
    delete:
      tags: [Marque-pages]
      operationId: supprimerMarquePage
      summary: Retirer un marque-page
      description: Retire un marque-page (M3).
      security:
        - jetonMembre: []
      parameters:
        - $ref: '#/components/parameters/IdChemin'
      responses:
        '204':
          description: Le marque-page est retiré.
        '401':
          $ref: '#/components/responses/NonConnecte'
        '404':
          $ref: '#/components/responses/Introuvable'

  # ------------------------------------------------------------------
  # Porte application : collections
  # ------------------------------------------------------------------

  /app/moi/collections:
    get:
      tags: [Collections]
      operationId: listerMesCollections
      summary: Mes collections
      description: Les collections du membre, publiques et privées, de la plus récemment modifiée à la plus ancienne (M4).
      security:
        - jetonMembre: []
      parameters:
        - $ref: '#/components/parameters/Lot'
        - $ref: '#/components/parameters/Taille'
      responses:
        '200':
          description: Un lot de collections.
          content:
