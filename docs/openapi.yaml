              schema:
                $ref: '#/components/schemas/ListeMesCollections'
        '401':
          $ref: '#/components/responses/NonConnecte'
        '422':
          $ref: '#/components/responses/ParametreRefuse'
    post:
      tags: [Collections]
      operationId: creerCollection
      summary: Créer une collection
      description: Crée une collection vide (M4), privée par défaut (M5).
      security:
        - jetonMembre: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemandeCollection'
      responses:
        '201':
          description: La collection est créée.
          content:
            application/json:
