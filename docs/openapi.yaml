        '401':
          $ref: '#/components/responses/NonConnecte'
        '422':
          $ref: '#/components/responses/ParametreRefuse'

  /app/moi/collections/{id}:
    get:
      tags: [Collections]
      operationId: lireMaCollection
      summary: Une de mes collections
      description: |
        Une collection du membre, avec toutes ses pages, y compris celles que le public
        ne voit pas (`masquee`). `masquee` au niveau de la collection dit si un
        administrateur l'a masquée (A4).
      security:
        - jetonMembre: []
      parameters:
        - $ref: '#/components/parameters/IdChemin'
      responses:
        '200':
          description: La collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaCollection'
        '401':
          $ref: '#/components/responses/NonConnecte'
        '404':
          $ref: '#/components/responses/Introuvable'
    patch:
      tags: [Collections]
      operationId: modifierCollection
      summary: Renommer ou publier une collection
      description: |
        Change le nom, la description, ou rend la collection publique ou privée (M4, M5).
        Seuls les champs envoyés changent.
      security:
        - jetonMembre: []
      parameters:
        - $ref: '#/components/parameters/IdChemin'
