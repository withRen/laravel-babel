  /app/moi:
    get:
      tags: [Comptes]
      operationId: lireMoi
      summary: Mon profil
      description: |
        Le membre connecté (M1). L'application web l'appelle au démarrage pour savoir si
        le jeton qu'elle garde est encore valide. `role` vaut `admin` pour un
        administrateur : l'application web peut alors proposer un lien vers le back-office.
      security:
        - jetonMembre: []
