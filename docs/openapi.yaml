        '401':
          $ref: '#/components/responses/NonConnecte'
        '422':
          $ref: '#/components/responses/ParametreRefuse'

  /app/moi/liens-courts/{slug}:
    delete:
      tags: [Liens courts]
      operationId: supprimerMonLienCourt
      summary: Supprimer un de mes liens courts
      description: Supprime un lien court du membre. Ses signalements partent avec lui (règle 13).
