  /app/moi/votes:
    get:
      tags: [Historique et données]
      operationId: listerMesVotes
      summary: Mes votes
      description: Les votes du membre, du plus récent au plus ancien (M7).
      security:
        - jetonMembre: []
      parameters:
        - $ref: '#/components/parameters/Lot'
        - $ref: '#/components/parameters/Taille'
      responses:
        '200':
          description: Un lot de votes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListeVotes'
        '401':
          $ref: '#/components/responses/NonConnecte'
        '422':
          $ref: '#/components/responses/ParametreRefuse'

  /app/moi/export:
    get:
      tags: [Historique et données]
      operationId: exporterMesDonnees
      summary: Exporter mes données
      description: |
        Le fichier d'export du membre (M11), au format commun `babel-export/v1`. La
        réponse porte `Content-Disposition: attachment` pour que le navigateur la
        télécharge.
      security:
        - jetonMembre: []
      responses:
        '200':
          description: Le fichier d'export.
          headers:
            Content-Disposition:
              description: '`attachment; filename="babel-export-<identifiant>-<date>.json"`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportCompte'
        '401':
          $ref: '#/components/responses/NonConnecte'

  /app/moi/import:
    post:
      tags: [Historique et données]
      operationId: importerMesDonnees
      summary: Importer un export
      description: |
        Importe le fichier d'export d'une autre bibliothèque (M12), envoyé tel quel en
        JSON (10 Mo au plus). Le fichier est vérifié en entier contre le schéma
        `ExportCompte` avant tout : un fichier hors contrat est refusé sans rien importer
        (`422 ERR_INVALID_IMPORT`, une erreur par problème trouvé, `champ` au format
        `marque_pages[3].adresse`).

        Le serveur recrée les marque-pages, les collections (privées) et les annotations
        (privées). Le reste du fichier n'est pas repris. Chaque adresse qui désigne une
        autre bibliothèque est ensuite **convertie en tâche de fond** : lue chez son
        origine, retrouvée ici avec `chercher` en mode `page`. En attendant, elle garde sa
        bibliothèque d'origine et `a_convertir` vaut `true`.
      security:
        - jetonMembre: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportCompte'
      responses:
        '202':
          description: Les données sont importées ; la conversion des adresses commence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultatImport'
        '401':
          $ref: '#/components/responses/NonConnecte'
        '422':
          $ref: '#/components/responses/ImportRefuse'
    get:
      tags: [Historique et données]
      operationId: lireEtatImport
      summary: Avancement de la conversion
      description: Combien d'adresses importées restent à convertir (M12). L'application web peut l'afficher jusqu'à zéro.
      security:
        - jetonMembre: []
      responses:
        '200':
          description: L'avancement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtatImport'
        '401':
          $ref: '#/components/responses/NonConnecte'

components:
  securitySchemes:
    jetonReseau:
      type: http
      scheme: bearer
      description: |
        Le jeton réseau, le même pour toutes les bibliothèques, remis par la plateforme.
        Il ouvre la lecture des textes bannis (`GET /textes-bannis`) et rien d'autre. Ce
        n'est pas le secret d'annonce, qui ne sert qu'auprès de l'annuaire et ne circule
        jamais entre bibliothèques.
    jetonMembre:
      type: http
      scheme: bearer
      description: |
        Le jeton de session d'un membre, renvoyé par `POST /app/auth/inscription` et
        `POST /app/auth/connexion` (Sanctum, `createToken()`). Il ne vaut que dans sa
        bibliothèque : aucune bibliothèque n'authentifie les membres d'une autre.

  parameters:
    AdresseChemin:
      name: adresse
      in: path
      required: true
      description: |
        L'adresse de la page, `<hexagone>-w<mur>-s<étagère>-v<volume>:<page>`.
        Jusqu'à 3 018 caractères. Le serveur la reçoit telle quelle et ne la corrige pas.
        Le paramètre n'a volontairement pas de motif : une adresse mal écrite doit
        arriver jusqu'au contrôleur pour recevoir une erreur du contrat.
      schema:
        type: string
      examples:
        premiere:
          summary: La toute première page
          value: 0-w1-s1-v1:1
        courte:
          summary: Une adresse courte
          value: babel-w2-s3-v17:204
    BibliothequeRequete:
      name: bibliotheque
      in: query
      required: false
      description: |
        La bibliothèque de la page. Absente ou égale à votre identifiant : la bibliothèque
        locale. Inconnue de votre serveur : `404 ERR_UNKNOWN_LIBRARY`.
      schema:
        $ref: '#/components/schemas/IdentifiantBibliotheque'
    IdentifiantChemin:
      name: identifiant
      in: path
      required: true
      description: L'identifiant d'une bibliothèque du réseau, la vôtre comprise.
      schema:
        $ref: '#/components/schemas/IdentifiantBibliotheque'
    IdChemin:
      name: id
      in: path
      required: true
      description: L'identifiant de la ressource, tel que le donne la liste.
      schema:
        $ref: '#/components/schemas/Id'
    SlugChemin:
      name: slug
      in: path
      required: true
      description: Le slug du lien court.
      schema:
        $ref: '#/components/schemas/Slug'
    Lot:
      name: lot
      in: query
      required: false
      description: Le numéro du lot demandé, à partir de 1. Mal écrit ou hors limites, il est refusé (`ERR_INVALID_PARAMETER`).
      schema:
        type: integer
        minimum: 1
        default: 1
    Taille:
      name: taille
      in: query
      required: false
      description: Le nombre d'éléments par lot, de 1 à 50. Mal écrit ou hors limites, il est refusé (`ERR_INVALID_PARAMETER`).
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20

  headers:
    RetryAfter:
      description: Le nombre de secondes à attendre avant de réessayer.
      required: true
      schema:
        type: integer
        minimum: 1

  responses:
    TropDeRequetes:
      description: Le quota est dépassé (A10). Sur la porte réseau, ce n'est pas un échec du pair.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReponseErreur'
          examples:
            quota:
              value:
                erreurs:
                  - code: ERR_TOO_MANY_REQUESTS
                    champ: null
                    message: Trop de requêtes, réessayez dans 30 secondes.
    ParametreRefuse:
      description: Un paramètre ou un champ du corps est absent, mal écrit ou hors limites. Toutes les erreurs sont renvoyées d'un coup.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReponseErreur'
          examples:
            tailleTropGrande:
              value:
                erreurs:
                  - code: ERR_INVALID_PARAMETER
                    champ: taille
                    message: La taille doit être comprise entre 1 et 50.
            inscription:
              summary: Deux champs refusés à l'inscription
              value:
                erreurs:
                  - code: ERR_INVALID_PARAMETER
                    champ: email
                    message: L'email n'est pas valide.
                  - code: ERR_INVALID_PARAMETER
                    champ: mot_de_passe
                    message: Le mot de passe doit faire au moins 8 caractères.
    AdresseRefusee:
      description: |
        L'adresse est mal écrite (au moins une erreur de forme), ou un autre champ est
        refusé. Les erreurs d'adresse viennent du moteur ou de `valider` (F5).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReponseErreur'
          examples:
            plusieursErreurs:
              summary: ABC-w9-s1-v1:1, deux erreurs renvoyées d'un coup (422, car l'une est de forme)
              value:
                erreurs:
                  - code: ERR_INVALID_HEX_CHARS
                    champ: hexagone
                    message: L'hexagone ne peut contenir que les chiffres 0 à 9 et les lettres minuscules a à z.
                  - code: ERR_OUT_OF_BOUNDS
                    champ: mur
                    message: Le mur doit être compris entre 1 et 4.
            adresseDeLivre:
              summary: 0-w1-s1-v1, une adresse de livre ne se lit pas
              value:
                erreurs:
                  - code: ERR_INVALID_ADDRESS_SYNTAX
                    champ: page
                    message: 'La page est absente ou mal écrite : un nombre décimal sans zéro de tête ni signe.'
    PageInexistante:
      description: L'adresse est bien écrite, mais la page n'existe pas (seulement des `ERR_OUT_OF_BOUNDS`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReponseErreur'
          examples:
            volumeHorsLimites:
              summary: Il n'y a que 32 volumes
              value:
                erreurs:
                  - code: ERR_OUT_OF_BOUNDS
                    champ: volume
                    message: Le volume doit être compris entre 1 et 32.
    PageInexistanteApp:
      description: |
        La page n'existe pas (seulement des `ERR_OUT_OF_BOUNDS`), la bibliothèque est
        inconnue de votre serveur (`ERR_UNKNOWN_LIBRARY`), ou la ressource visée
        n'existe pas (`ERR_NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReponseErreur'
          examples:
            volumeHorsLimites:
              value:
                erreurs:
                  - code: ERR_OUT_OF_BOUNDS
                    champ: volume
                    message: Le volume doit être compris entre 1 et 32.
            bibliothequeInconnue:
              value:
                erreurs:
                  - code: ERR_UNKNOWN_LIBRARY
                    champ: bibliotheque
                    message: Cette bibliothèque ne fait pas partie du réseau.
    RechercheRefusee:
      description: Le texte ou le mode est refusé (une seule erreur, contrôles dans l'ordre mode, texte vide, longueur).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReponseErreur'
          examples:
            videApresNormalisation:
              summary: Le texte « ?! » est vide une fois normalisé
              value:
                erreurs:
                  - code: ERR_EMPTY_QUERY
                    champ: texte
                    message: Le texte recherché est vide.
            modeInconnu:
              summary: Le mode « Exact » n'existe pas (la casse compte)
              value:
                erreurs:
                  - code: ERR_UNKNOWN_MODE
                    champ: mode
                    message: Le mode doit être exact, bruit ou page.
    Introuvable:
      description: |
        La ressource n'existe pas, n'est pas publique, est masquée ou appartient à un
        autre membre (`ERR_NOT_FOUND`), ou la bibliothèque est inconnue de votre serveur
        (`ERR_UNKNOWN_LIBRARY`). Toujours la même réponse, pour ne rien laisser deviner.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReponseErreur'
          examples:
            inconnue:
              value:
                erreurs:
                  - code: ERR_NOT_FOUND
                    champ: id
                    message: Cette ressource n'existe pas ou n'est pas visible.
            bibliothequeInconnue:
              value:
                erreurs:
                  - code: ERR_UNKNOWN_LIBRARY
                    champ: identifiant
                    message: Cette bibliothèque ne fait pas partie du réseau.
    NonConnecte:
      description: |
        Pas de jeton de session, jeton invalide ou révoqué (`ERR_UNAUTHENTICATED`), ou
        email et mot de passe qui ne correspondent pas (`ERR_INVALID_CREDENTIALS`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReponseErreur'
          examples:
            sansJeton:
              value:
                erreurs:
                  - code: ERR_UNAUTHENTICATED
                    champ: null
                    message: Connectez-vous pour continuer.
            identifiantsFaux:
              value:
                erreurs:
                  - code: ERR_INVALID_CREDENTIALS
                    champ: null
                    message: Email ou mot de passe incorrect.
    Interdit:
      description: Compte suspendu (`ERR_ACCOUNT_SUSPENDED`) ou inscriptions fermées (`ERR_REGISTRATION_CLOSED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReponseErreur'
          examples:
            suspendu:
              value:
                erreurs:
                  - code: ERR_ACCOUNT_SUSPENDED
                    champ: null
                    message: Ce compte est suspendu.
            fermees:
              value:
                erreurs:
                  - code: ERR_REGISTRATION_CLOSED
                    champ: null
                    message: Les inscriptions sont fermées.
    Doublon:
      description: La ressource existe déjà (`ERR_ALREADY_EXISTS`) ; `champ` dit sur quoi porte le doublon.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReponseErreur'
          examples:
            emailPris:
              value:
                erreurs:
                  - code: ERR_ALREADY_EXISTS
                    champ: email
                    message: Un compte utilise déjà cet email.
            dejaGardee:
              value:
                erreurs:
                  - code: ERR_ALREADY_EXISTS
                    champ: adresse
                    message: Cette page est déjà dans vos marque-pages.
    LienExpire:
      description: Le lien court a expiré (`ERR_SHORT_LINK_EXPIRED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReponseErreur'
          examples:
            expire:
              value:
                erreurs:
                  - code: ERR_SHORT_LINK_EXPIRED
                    champ: slug
                    message: Ce lien a expiré.
    PairInjoignable:
      description: |
        Le pair n'a pas répondu dans les 2 secondes, est éteint, ou a répondu hors contrat
        (`ERR_PEER_UNREACHABLE`). Le compteur d'échecs du pair augmente (A9).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReponseErreur'
          examples:
            injoignable:
              value:
                erreurs:
                  - code: ERR_PEER_UNREACHABLE
                    champ: bibliotheque
                    message: La bibliothèque voisine ne répond pas.
    PairOccupe:
      description: |
        Le pair a répondu `429` (`ERR_PEER_BUSY`). Ce n'est pas un échec : son compteur
        ne bouge pas. `Retry-After` reprend la valeur donnée par le pair, si elle existe.
      headers:
        Retry-After:
          description: Le nombre de secondes à attendre, si le pair l'a donné.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReponseErreur'
          examples:
            occupe:
              value:
                erreurs:
                  - code: ERR_PEER_BUSY
                    champ: bibliotheque
                    message: La bibliothèque voisine est occupée, réessayez plus tard.
    ImportRefuse:
      description: Le fichier ne respecte pas le schéma `ExportCompte` ; rien n'est importé (`ERR_INVALID_IMPORT`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReponseErreur'
          examples:
            adresseInvalide:
              value:
                erreurs:
                  - code: ERR_INVALID_IMPORT
                    champ: marque_pages[3].adresse
                    message: Cette adresse est mal écrite.
                  - code: ERR_INVALID_IMPORT
                    champ: format
                    message: Le format doit être babel-export/v1.

  schemas:
    # ---------------------------------------------------------------
    # Briques communes
    # ---------------------------------------------------------------

    IdentifiantBibliotheque:
      type: string
      description: |
        L'identifiant stable d'une bibliothèque, remis par la plateforme. Il ne change
        jamais, contrairement à son URL.
      pattern: '^[a-z0-9][a-z0-9-]{1,31}$'
      examples: [exemple]

    Id:
      type: string
      description: |
        L'identifiant d'une ressource (collection, annotation, marque-page, recherche…),
        opaque pour l'application web et les autres bibliothèques : un nombre écrit en
        chaîne, un UUID… Toujours renvoyé **en chaîne** (`"12"`, pas `12`).
      pattern: '^[A-Za-z0-9_-]{1,64}$'
      examples: ['12']

    Slug:
      type: string
      description: Le slug d'un lien court, choisi par le serveur.
      pattern: '^[A-Za-z0-9_-]{4,32}$'
      examples: [k7Hq2x]

    Empreinte:
      type: string
      description: 64 caractères hexadécimaux minuscules (SHA-256 ou HMAC-SHA256).
      pattern: '^[0-9a-f]{64}$'
      examples: [f85a8e8ae6a8a1ceb96d8884d2d45c00c3cc73c95e1bdf4e5cba35664bb0c637]

    AdressePage:
      type: string
      description: |
        Une adresse de page bien écrite : `<hexagone>-w<mur>-s<étagère>-v<volume>:<page>`.
        Hexagone en base 36 minuscule sans zéro de tête (au plus 3 004 caractères), mur
        1 à 4, étagère 1 à 5, volume 1 à 32, page 1 à 410, sans zéro de tête.
        Le motif ne vérifie pas le dernier hexagone, qui ne contient qu'une page : c'est
        le rôle de `valider` (F5).
      maxLength: 3018
      pattern: '^(0|[1-9a-z][0-9a-z]{0,3003})-w[1-4]-s[1-5]-v([1-9]|[12][0-9]|3[0-2]):([1-9]|[1-9][0-9]|[1-3][0-9]{2}|40[0-9]|410)$'
      examples: [0-w1-s1-v1:1, babel-w2-s3-v17:204]

    AdresseLivre:
      type: string
      description: L'adresse d'un livre entier, sans `:<page>`.
      maxLength: 3014
      pattern: '^(0|[1-9a-z][0-9a-z]{0,3003})-w[1-4]-s[1-5]-v([1-9]|[12][0-9]|3[0-2])$'
      examples: [babel-w2-s3-v17]

    AdresseCible:
      type: string
      description: Une adresse de page ou de livre (sans `:<page>`). Seul un lien court peut viser un livre.
      maxLength: 3018
      pattern: '^(0|[1-9a-z][0-9a-z]{0,3003})-w[1-4]-s[1-5]-v([1-9]|[12][0-9]|3[0-2])(:([1-9]|[1-9][0-9]|[1-3][0-9]{2}|40[0-9]|410))?$'
      examples: [babel-w2-s3-v17, babel-w2-s3-v17:204]

    TextePage:
      type: string
      description: Le texte d'une page, exactement 3 200 caractères pris parmi les 29 symboles.
      minLength: 3200
      maxLength: 3200
      pattern: '^[a-z ,.]{3200}$'

    TexteNormalise:
      type: string
      description: |
        Un texte passé par les 5 étapes de la normalisation (F3) : les 29 symboles,
        sans espace en bord ni espaces qui se suivent. De 1 à 3 200 caractères.
      minLength: 1
      maxLength: 3200
      pattern: '^[a-z,.]+( [a-z,.]+)*$'

    Mode:
      type: string
      description: |
        `exact` : le texte seul, le reste de la page en espaces.
        `bruit` : le texte entouré de caractères pseudo-aléatoires.
        `page` : le texte fait exactement 3 200 caractères, on obtient l'adresse de cette
        page. L'interface ne propose que `exact` et `bruit` (V5).
      enum: [exact, bruit, page]

    DateHeure:
      type: string
      format: date-time
      description: Date et heure ISO 8601 avec fuseau, par exemple `2026-11-20T14:05:00+01:00`.

    DateHeureOuNull:
      oneOf:
        - $ref: '#/components/schemas/DateHeure'
        - type: 'null'

    UrlOuNull:
      type: [string, 'null']
      format: uri
      description: Une URL absolue, ou `null`.

    PageDesignee:
      type: object
      additionalProperties: false
      required: [bibliotheque, adresse]
      description: Une page et la bibliothèque où la lire.
      properties:
        bibliotheque:
          $ref: '#/components/schemas/IdentifiantBibliotheque'
        adresse:
          $ref: '#/components/schemas/AdressePage'

    DemandePageDesignee:
      type: object
      required: [adresse]
      description: Une page désignée dans une requête. `bibliotheque` absente vaut la bibliothèque locale.
      properties:
        bibliotheque:
          $ref: '#/components/schemas/IdentifiantBibliotheque'
        adresse:
          type: string
          description: L'adresse de page, contrôlée par `valider` (F5).

    # ---------------------------------------------------------------
    # Porte réseau
    # ---------------------------------------------------------------

    Identite:
      type: object
      additionalProperties: false
      required: [identifiant, nom, description, empreinte_cle, algorithme, contrat, application_web]
      properties:
        identifiant:
          $ref: '#/components/schemas/IdentifiantBibliotheque'
        nom:
          type: string
          minLength: 1
          maxLength: 100
          description: Le nom de la bibliothèque (A8).
        description:
          type: string
          maxLength: 1000
          description: Sa description (A8). Chaîne vide si elle n'en a pas.
        empreinte_cle:
          $ref: '#/components/schemas/Empreinte'
          description: L'empreinte de la clé, `$moteur->empreinte()` telle quelle (F8).
        algorithme:
          type: string
          const: babel-moteur/v1
          description: La version de l'algorithme du moteur, `Moteur::ALGORITHME`.
        contrat:
          type: string
          pattern: '^1\.[0-9]+\.[0-9]+$'
          description: La version de ce contrat que la bibliothèque respecte (1.x).
        application_web:
          $ref: '#/components/schemas/UrlOuNull'
          description: |
            L'adresse publique de son application web, si elle en a une en ligne. Les pairs
            peuvent proposer d'y ouvrir une page (V16, V21).

    Page:
      type: object
      additionalProperties: false
      required: [bibliotheque, adresse, texte]
      properties:
        bibliotheque:
          $ref: '#/components/schemas/IdentifiantBibliotheque'
        adresse:
          $ref: '#/components/schemas/AdressePage'
          description: L'adresse demandée, identique à l'octet près.
        texte:
          $ref: '#/components/schemas/TextePage'

    DemandeLectures:
      type: object
      required: [adresses]
      properties:
        adresses:
          type: array
          minItems: 1
          maxItems: 50
          description: De 1 à 50 adresses de page. Au-delà, `ERR_INVALID_PARAMETER` sur `adresses`.
          items:
            type: string

    ResultatLectures:
      type: object
      additionalProperties: false
      required: [bibliotheque, elements]
      properties:
        bibliotheque:
          $ref: '#/components/schemas/IdentifiantBibliotheque'
        elements:
          type: array
          description: Une entrée par adresse demandée, dans le même ordre. Soit `texte`, soit `erreurs`, l'autre vaut `null`.
          items:
            type: object
            additionalProperties: false
            required: [adresse, texte, erreurs]
            properties:
              adresse:
                type: string
                description: L'adresse demandée, telle quelle.
              texte:
                oneOf:
                  - $ref: '#/components/schemas/TextePage'
                  - type: 'null'
              erreurs:
                oneOf:
                  - type: array
                    minItems: 1
                    items:
                      $ref: '#/components/schemas/Erreur'
                  - type: 'null'

    DemandeRecherche:
      type: object
      required: [texte, mode]
      properties:
        texte:
          type: string
          description: |
            Le texte à chercher, tel que la personne l'a saisi : le serveur le normalise.
            En mode `page`, le texte brut d'une page (3 200 caractères après les étapes 1 à 3).
        mode:
          $ref: '#/components/schemas/Mode'

    ResultatRecherche:
      type: object
      additionalProperties: false
      required: [bibliotheque, texte_normalise, mode, adresse]
      properties:
        bibliotheque:
          $ref: '#/components/schemas/IdentifiantBibliotheque'
        texte_normalise:
          type: string
          minLength: 1
          maxLength: 3200
          pattern: '^[a-z ,.]+$'
          description: |
            Le texte réellement cherché, après normalisation (V6). En modes `exact` et
            `bruit`, il respecte `TexteNormalise` ; en mode `page`, il fait 3 200 caractères.
        mode:
          $ref: '#/components/schemas/Mode'
        adresse:
          $ref: '#/components/schemas/AdressePage'
          description: L'adresse d'une page qui contient le texte.

    ResumeCollection:
      type: object
      additionalProperties: false
      required: [id, nom, description, nombre_pages, maj_le]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nom:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
          description: Chaîne vide si la collection n'en a pas.
        nombre_pages:
          type: integer
          minimum: 0
          description: Le nombre de pages montrées, celles marquées par un texte banni non comptées.
        maj_le:
          $ref: '#/components/schemas/DateHeure'

    Collection:
      type: object
      additionalProperties: false
      required: [id, nom, description, nombre_pages, maj_le, pages]
      description: Une collection publique, vue par le public. Les champs de `ResumeCollection`, plus les pages.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nom:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        nombre_pages:
          type: integer
          minimum: 0
        maj_le:
          $ref: '#/components/schemas/DateHeure'
        pages:
          type: array
          description: Les pages montrées, par position croissante.
          items:
            type: object
            additionalProperties: false
            required: [position, bibliotheque, adresse]
            properties:
              position:
                type: integer
                minimum: 1
              bibliotheque:
                $ref: '#/components/schemas/IdentifiantBibliotheque'
              adresse:
                $ref: '#/components/schemas/AdressePage'

    ListeCollections:
      type: object
      additionalProperties: false
      required: [lot, taille, total, elements]
      properties:
        lot:
          type: integer
          minimum: 1
        taille:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
          description: Le nombre total de collections publiques et non masquées.
        elements:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ResumeCollection'

    PagePopulaire:
      type: object
      additionalProperties: false
      required: [bibliotheque, adresse, score]
      properties:
        bibliotheque:
          $ref: '#/components/schemas/IdentifiantBibliotheque'
        adresse:
          $ref: '#/components/schemas/AdressePage'
        score:
          type: integer
          description: Total anonyme, votes et marque-pages. Plus il est grand, plus la page est populaire.

    ListePagesPopulaires:
      type: object
      additionalProperties: false
      required: [elements]
      properties:
        elements:
          type: array
          maxItems: 50
          description: Par score décroissant.
          items:
            $ref: '#/components/schemas/PagePopulaire'

    TexteBanni:
      type: object
      additionalProperties: false
      required: [texte, empreinte, motif, banni_le]
      properties:
        texte:
          $ref: '#/components/schemas/TexteNormalise'
          description: Le texte banni lui-même, normalisé. C'est lui que les pairs cherchent chez eux.
        empreinte:
          $ref: '#/components/schemas/Empreinte'
          description: |
            SHA-256 en hexadécimal minuscule du texte (octets UTF-8), `hash('sha256', $texte)`.
            Elle sert à repérer les doublons, pas à chercher.
        motif:
          type: [string, 'null']
          maxLength: 500
          description: Le motif donné par votre administrateur, pour aider les autres à décider.
        banni_le:
          $ref: '#/components/schemas/DateHeure'

    ListeTextesBannis:
      type: object
      additionalProperties: false
      required: [elements]
      properties:
        elements:
          type: array
          items:
            $ref: '#/components/schemas/TexteBanni'

    # ---------------------------------------------------------------
    # Porte application : bibliothèque et réseau
    # ---------------------------------------------------------------

    Infos:
      type: object
      additionalProperties: false
      required: [identifiant, nom, description, empreinte_cle, algorithme, contrat, application_web, inscriptions_ouvertes, constantes, limites, reseau, temps_reel]
      properties:
        identifiant:
          $ref: '#/components/schemas/IdentifiantBibliotheque'
        nom:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        empreinte_cle:
          $ref: '#/components/schemas/Empreinte'
        algorithme:
          type: string
          const: babel-moteur/v1
        contrat:
          type: string
          pattern: '^1\.[0-9]+\.[0-9]+$'
        application_web:
          $ref: '#/components/schemas/UrlOuNull'
        inscriptions_ouvertes:
          type: boolean
          description: Faux quand l'administrateur a fermé les inscriptions (A8).
        constantes:
          type: object
          additionalProperties: false
          description: Les constantes du moteur, identiques dans les 10 bibliothèques.
          required: [alphabet, longueur_page, murs, etageres, volumes, pages, longueur_max_hexagone, dernier_hexagone]
          properties:
            alphabet:
              type: string
              const: 'abcdefghijklmnopqrstuvwxyz ,.'
            longueur_page:
              type: integer
              const: 3200
            murs:
              type: integer
              const: 4
            etageres:
              type: integer
              const: 5
            volumes:
              type: integer
              const: 32
            pages:
              type: integer
              const: 410
            longueur_max_hexagone:
              type: integer
              const: 3004
            dernier_hexagone:
              type: string
              description: |
                Le nom du dernier hexagone, en base 36. Il ne contient que la page
                `w1-s1-v1:1` : `voisine` (F6) s'en sert pour signaler `ERR_LIBRARY_LIMIT`.
                Dans le navigateur, comparez les hexagones avec `BigInt`, jamais avec `Number`.
              const: ''
        limites:
          type: object
          additionalProperties: false
          description: Les limites que le serveur applique, pour que l'application web contrôle les saisies avant l'envoi.
          required: [taille_lot_max, annotation_max, motif_signalement_max, nom_collection_max, description_collection_max, pseudo_max, mot_de_passe_min, duree_lien_visiteur_jours, import_max_octets]
          properties:
            taille_lot_max:
              type: integer
              const: 50
            annotation_max:
              type: integer
              const: 2000
            motif_signalement_max:
              type: integer
              const: 500
            nom_collection_max:
              type: integer
              const: 100
            description_collection_max:
              type: integer
              const: 1000
            pseudo_max:
              type: integer
              const: 30
            mot_de_passe_min:
              type: integer
              const: 8
            duree_lien_visiteur_jours:
              type: integer
              minimum: 1
              description: La durée maximale d'un lien court créé sans compte, choisie par la bibliothèque.
            import_max_octets:
              type: integer
              const: 10485760
        reseau:
          type: object
          additionalProperties: false
          required: [delai_pair_ms]
          properties:
            delai_pair_ms:
              type: integer
              const: 2000
              description: Le délai accordé à chaque pair (contrat). Le délai global d'une recherche réseau est fixé par l'application web.
        temps_reel:
          description: |
            Les paramètres de connexion au serveur temps réel (protocole Pusher : Laravel
            Reverb côté serveur, Laravel Echo et `pusher-js` côté Angular). `null` si la
            bibliothèque n'a pas de temps réel : l'application web interroge alors
            `GET /app/recherches-reseau/{identifiant}`.
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [protocole, cle, hote, port, tls]
              properties:
                protocole:
                  type: string
                  const: pusher
                cle:
                  type: string
                  description: La clé publique de l'application Reverb (`REVERB_APP_KEY`). Ce n'est pas un secret.
                hote:
                  type: string
                  description: L'hôte du serveur temps réel, vu depuis le navigateur.
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                tls:
                  type: boolean
                  description: Vrai pour une connexion `wss://`.

    BibliothequeReseau:
      type: object
      additionalProperties: false
      required: [identifiant, nom, description, est_locale, etat, dernier_contact_le, cle_changee_le, application_web]
      properties:
        identifiant:
          $ref: '#/components/schemas/IdentifiantBibliotheque'
        nom:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        est_locale:
          type: boolean
          description: Vrai pour votre bibliothèque, et pour elle seule.
        etat:
          type: string
          enum: [en_ligne, hors_ligne, inconnu]
          description: |
            `hors_ligne` après le troisième échec de suite, jusqu'au prochain contrôle réussi
            (livrable 4, choix 8). `inconnu` tant qu'aucun contrôle n'a eu lieu. La
            bibliothèque locale est toujours `en_ligne`.
        dernier_contact_le:
          $ref: '#/components/schemas/DateHeureOuNull'
        cle_changee_le:
          $ref: '#/components/schemas/DateHeureOuNull'
          description: |
            Daté quand l'empreinte de clé publiée par cette bibliothèque a changé (A9) :
            les adresses enregistrées vers elle ne désignent plus les mêmes textes.
        application_web:
          $ref: '#/components/schemas/UrlOuNull'

    ListeBibliotheques:
      type: object
      additionalProperties: false
      required: [elements]
      properties:
        elements:
          type: array
          items:
            $ref: '#/components/schemas/BibliothequeReseau'

    # ---------------------------------------------------------------
    # Porte application : comptes
    # ---------------------------------------------------------------

    Utilisateur:
      type: object
      additionalProperties: false
      required: [id, pseudo, email, role, cree_le]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        pseudo:
          type: string
          minLength: 1
          maxLength: 30
        email:
          type: string
          format: email
        role:
          type: string
          enum: [membre, admin]
        cree_le:
          $ref: '#/components/schemas/DateHeure'

    AuteurPublic:
      type: object
      additionalProperties: false
      required: [pseudo]
      description: "Ce qu'on montre de l'auteur d'un contenu public : son pseudo, rien d'autre."
      properties:
        pseudo:
          type: string

    DemandeInscription:
      type: object
      required: [pseudo, email, mot_de_passe]
      properties:
        pseudo:
          type: string
          minLength: 1
          maxLength: 30
        email:
          type: string
          format: email
          description: Sert d'identifiant de connexion. Unique dans la bibliothèque.
        mot_de_passe:
          type: string
          minLength: 8
          writeOnly: true

    DemandeConnexion:
      type: object
      required: [email, mot_de_passe]
      properties:
        email:
          type: string
        mot_de_passe:
          type: string
          writeOnly: true

    Session:
      type: object
      additionalProperties: false
      required: [jeton, type, utilisateur]
      properties:
        jeton:
          type: string
          minLength: 1
          description: "Le jeton de session, à garder par l'application web et à envoyer dans `Authorization: Bearer …`."
        type:
          type: string
          const: Bearer
        utilisateur:
          $ref: '#/components/schemas/Utilisateur'

    ModificationProfil:
      type: object
      minProperties: 1
      properties:
        pseudo:
          type: string
          minLength: 1
          maxLength: 30
        email:
          type: string
          format: email
        mot_de_passe:
          type: string
          minLength: 8
          writeOnly: true
          description: Le nouveau mot de passe.
        mot_de_passe_actuel:
          type: string
          writeOnly: true
          description: Obligatoire pour changer l'email ou le mot de passe.

    DemandeSuppressionCompte:
      type: object
      required: [mot_de_passe]
      properties:
        mot_de_passe:
          type: string
          writeOnly: true

    # ---------------------------------------------------------------
    # Porte application : lecture et votes
    # ---------------------------------------------------------------

    PageLue:
      type: object
      additionalProperties: false
      required: [bibliotheque, adresse, adresse_livre, texte, score, mon_vote, marque_page, annotations]
      properties:
        bibliotheque:
          $ref: '#/components/schemas/IdentifiantBibliotheque'
        adresse:
          $ref: '#/components/schemas/AdressePage'
        adresse_livre:
          $ref: '#/components/schemas/AdresseLivre'
          description: L'adresse du livre qui contient la page, pour un lien court vers le livre entier (V11).
        texte:
          $ref: '#/components/schemas/TextePage'
        score:
          type: integer
          description: Le score de la page chez vous (votes et marque-pages de vos membres), même formule que les pages populaires.
        mon_vote:
          type: [integer, 'null']
          enum: [1, -1, null]
          description: Le vote du membre connecté ; `null` sans vote ou pour un visiteur.
        marque_page:
          description: Le marque-page du membre connecté sur cette page ; `null` sinon.
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [id, titre]
              properties:
                id:
                  $ref: '#/components/schemas/Id'
                titre:
                  type: [string, 'null']
        annotations:
          type: array
          description: |
            Les annotations publiques non masquées, et celles du membre connecté (privées
            comprises), de la plus récente à la plus ancienne. L'application web retire
            celles que la personne a signalées (V18).
          items:
            $ref: '#/components/schemas/Annotation'

    DemandeVote:
      type: object
      required: [valeur]
      properties:
        valeur:
          type: integer
          enum: [1, -1]

    EtatVote:
      type: object
      additionalProperties: false
      required: [bibliotheque, adresse, mon_vote, score]
      properties:
        bibliotheque:
          $ref: '#/components/schemas/IdentifiantBibliotheque'
        adresse:
          $ref: '#/components/schemas/AdressePage'
        mon_vote:
          type: [integer, 'null']
          enum: [1, -1, null]
        score:
          type: integer
          description: Le score de la page après le vote.

    Vote:
      type: object
      additionalProperties: false
      required: [bibliotheque, adresse, valeur, cree_le]
      properties:
        bibliotheque:
          $ref: '#/components/schemas/IdentifiantBibliotheque'
        adresse:
          $ref: '#/components/schemas/AdressePage'
        valeur:
          type: integer
          enum: [1, -1]
        cree_le:
          $ref: '#/components/schemas/DateHeure'

    ListeVotes:
      type: object
      additionalProperties: false
      required: [lot, taille, total, elements]
      properties:
        lot:
          type: integer
          minimum: 1
        taille:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        elements:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Vote'

    # ---------------------------------------------------------------
    # Porte application : recherche réseau
    # ---------------------------------------------------------------

    IdentifiantRecherche:
      type: string
      format: uuid
      description: Un UUID v4 tiré par l'application web (`crypto.randomUUID()`).
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'

    DemandeRechercheReseau:
      type: object
      required: [identifiant, texte, mode]
      properties:
        identifiant:
          $ref: '#/components/schemas/IdentifiantRecherche'
        texte:
          type: string
          description: Le texte saisi ; le serveur le normalise une fois et envoie le texte normalisé aux pairs.
        mode:
          $ref: '#/components/schemas/Mode'

    RechercheReseauLancee:
      type: object
      additionalProperties: false
      required: [identifiant, texte_normalise, mode, locale, interroges, absents, delai_pair_ms, canal]
      properties:
        identifiant:
          $ref: '#/components/schemas/IdentifiantRecherche'
        texte_normalise:
          type: string
          minLength: 1
          maxLength: 3200
        mode:
          $ref: '#/components/schemas/Mode'
        locale:
          $ref: '#/components/schemas/PageDesignee'
          description: L'adresse trouvée chez vous par le moteur.
        interroges:
          type: array
          description: Les pairs en ligne, interrogés. Un événement `resultat` arrivera pour chacun.
          items:
            $ref: '#/components/schemas/IdentifiantBibliotheque'
        absents:
          type: array
          description: Les pairs hors ligne, non interrogés. Ils comptent parmi les absents du bilan.
          items:
            $ref: '#/components/schemas/IdentifiantBibliotheque'
        delai_pair_ms:
          type: integer
          const: 2000
        canal:
          type: string
          description: Le nom du canal temps réel, `recherche-reseau.{identifiant}`.

    ResultatPair:
      type: object
      additionalProperties: false
      required: [bibliotheque, statut, adresse, texte_normalise, recu_le]
      properties:
        bibliotheque:
          $ref: '#/components/schemas/IdentifiantBibliotheque'
        statut:
          type: string
          enum: [trouve, sans_reponse, occupe]
          description: |
            `trouve` : le pair a répondu dans le contrat. `sans_reponse` : éteint, trop lent
            ou hors contrat (son compteur d'échecs augmente). `occupe` : il a répondu `429`
            (pas un échec).
        adresse:
          description: L'adresse trouvée chez ce pair, à lire avec `GET /app/pages/{adresse}?bibliotheque=…` ; `null` sauf si `trouve`.
          oneOf:
            - $ref: '#/components/schemas/AdressePage'
            - type: 'null'
        texte_normalise:
          type: [string, 'null']
          description: Le texte normalisé renvoyé par le pair. S'il diffère du vôtre, l'un des deux applique mal F3.
        recu_le:
          $ref: '#/components/schemas/DateHeure'

    EtatRechercheReseau:
      type: object
      additionalProperties: false
      required: [identifiant, texte_normalise, mode, etat, locale, interroges, absents, resultats, lancee_le]
      properties:
        identifiant:
          $ref: '#/components/schemas/IdentifiantRecherche'
        texte_normalise:
          type: string
          minLength: 1
          maxLength: 3200
        mode:
          $ref: '#/components/schemas/Mode'
        etat:
          type: string
          enum: [en_cours, terminee]
        locale:
          $ref: '#/components/schemas/PageDesignee'
        interroges:
          type: array
          items:
            $ref: '#/components/schemas/IdentifiantBibliotheque'
        absents:
          type: array
          items:
            $ref: '#/components/schemas/IdentifiantBibliotheque'
        resultats:
          type: array
          description: Les résultats déjà arrivés, dans l'ordre d'arrivée.
          items:
            $ref: '#/components/schemas/ResultatPair'
        lancee_le:
          $ref: '#/components/schemas/DateHeure'

    EvenementResultat:
      type: object
      additionalProperties: false
      description: Événement `resultat` du canal `recherche-reseau.{identifiant}`.
      required: [identifiant, resultat]
      properties:
        identifiant:
          $ref: '#/components/schemas/IdentifiantRecherche'
        resultat:
          $ref: '#/components/schemas/ResultatPair'

    EvenementTerminee:
      type: object
      additionalProperties: false
      description: Événement `terminee` du canal `recherche-reseau.{identifiant}`, publié quand toutes les tâches sont finies.
      required: [identifiant, interroges, ont_repondu, absents]
      properties:
        identifiant:
          $ref: '#/components/schemas/IdentifiantRecherche'
        interroges:
          type: integer
          minimum: 0
        ont_repondu:
          type: integer
          minimum: 0
          description: Le nombre de pairs au statut `trouve`, pour le bilan « 7 pairs sur 9 ont répondu ».
        absents:
          type: array
          description: Les pairs sans réponse, occupés ou hors ligne.
          items:
            $ref: '#/components/schemas/IdentifiantBibliotheque'

    # ---------------------------------------------------------------
    # Porte application : liens courts
    # ---------------------------------------------------------------

    DemandeLienCourt:
      type: object
      required: [cible]
      properties:
        cible:
          oneOf:
            - type: object
              required: [type, adresse]
              properties:
                type:
                  const: adresse
                bibliotheque:
                  $ref: '#/components/schemas/IdentifiantBibliotheque'
                adresse:
                  type: string
                  description: Une adresse de page ou de livre.
            - type: object
              required: [type, id]
              properties:
                type:
                  const: collection
                id:
                  $ref: '#/components/schemas/Id'
        passage:
          type: [string, 'null']
          maxLength: 3200
          description: Le texte à surligner, pour une page seulement. Il doit figurer dans la page.
        expire_le:
          $ref: '#/components/schemas/DateHeureOuNull'
          description: Facultatif. Obligatoire en pratique pour un visiteur (absent = durée maximale).

    CibleLienCourt:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, bibliotheque, adresse, niveau]
          properties:
            type:
              const: adresse
            bibliotheque:
              $ref: '#/components/schemas/IdentifiantBibliotheque'
            adresse:
              $ref: '#/components/schemas/AdresseCible'
            niveau:
              type: string
              enum: [page, livre]
        - type: object
          additionalProperties: false
          required: [type, id]
          properties:
            type:
              const: collection
            id:
              $ref: '#/components/schemas/Id'

    LienCourt:
      type: object
      additionalProperties: false
      required: [slug, cible, passage, visites, expire_le, cree_le]
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        cible:
          $ref: '#/components/schemas/CibleLienCourt'
        passage:
          type: [string, 'null']
        visites:
          type: integer
          minimum: 0
        expire_le:
          $ref: '#/components/schemas/DateHeureOuNull'
        cree_le:
          $ref: '#/components/schemas/DateHeure'

    LienCourtOuvert:
      type: object
      additionalProperties: false
      required: [slug, cible, passage, expire_le]
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        cible:
          oneOf:
            - type: object
              additionalProperties: false
              required: [type, bibliotheque, adresse, niveau, adresse_a_ouvrir]
              properties:
                type:
                  const: adresse
                bibliotheque:
                  $ref: '#/components/schemas/IdentifiantBibliotheque'
                adresse:
                  $ref: '#/components/schemas/AdresseCible'
                niveau:
                  type: string
                  enum: [page, livre]
                adresse_a_ouvrir:
                  $ref: '#/components/schemas/AdressePage'
                  description: "La page à ouvrir : la page elle-même, ou la page 1 du livre."
            - type: object
              additionalProperties: false
              required: [type, collection]
              properties:
                type:
                  const: collection
                collection:
                  $ref: '#/components/schemas/Collection'
        passage:
          type: [string, 'null']
          description: Le texte à surligner avec `localiser` (F4).
        expire_le:
          $ref: '#/components/schemas/DateHeureOuNull'

    ListeLiensCourts:
      type: object
      additionalProperties: false
      required: [lot, taille, total, elements]
      properties:
        lot:
          type: integer
          minimum: 1
        taille:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        elements:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/LienCourt'

    # ---------------------------------------------------------------
    # Porte application : marque-pages
    # ---------------------------------------------------------------

    MarquePage:
      type: object
      additionalProperties: false
      required: [id, bibliotheque, adresse, titre, a_convertir, cree_le]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        bibliotheque:
          $ref: '#/components/schemas/IdentifiantBibliotheque'
        adresse:
          $ref: '#/components/schemas/AdressePage'
        titre:
          type: [string, 'null']
          maxLength: 100
        a_convertir:
          type: boolean
          description: Vrai pour une adresse importée qui désigne encore l'ancienne bibliothèque (M12).
        cree_le:
          $ref: '#/components/schemas/DateHeure'

    DemandeMarquePage:
      type: object
      required: [adresse]
      properties:
        bibliotheque:
          $ref: '#/components/schemas/IdentifiantBibliotheque'
        adresse:
          type: string
          description: L'adresse de page, contrôlée par `valider` (F5).
        titre:
          type: [string, 'null']
          maxLength: 100

    ModificationMarquePage:
      type: object
      required: [titre]
      properties:
        titre:
          type: [string, 'null']
          maxLength: 100

    ListeMarquePages:
      type: object
      additionalProperties: false
      required: [lot, taille, total, elements]
      properties:
        lot:
          type: integer
          minimum: 1
        taille:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        elements:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/MarquePage'

    # ---------------------------------------------------------------
    # Porte application : collections du membre
    # ---------------------------------------------------------------

    ResumeMaCollection:
      type: object
      additionalProperties: false
      required: [id, nom, description, est_publique, masquee, nombre_pages, cree_le, maj_le]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nom:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        est_publique:
          type: boolean
        masquee:
          type: boolean
          description: Vrai si un administrateur l'a masquée (A4) ; elle n'est alors plus montrée au public.
        nombre_pages:
          type: integer
          minimum: 0
          description: Toutes les pages, masquées comprises.
        cree_le:
          $ref: '#/components/schemas/DateHeure'
        maj_le:
          $ref: '#/components/schemas/DateHeure'

    MaCollection:
      type: object
      additionalProperties: false
      required: [id, nom, description, est_publique, masquee, nombre_pages, cree_le, maj_le, pages]
      description: Une collection vue par son auteur. Les champs de `ResumeMaCollection`, plus toutes les pages.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nom:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        est_publique:
          type: boolean
        masquee:
          type: boolean
        nombre_pages:
          type: integer
          minimum: 0
        cree_le:
          $ref: '#/components/schemas/DateHeure'
        maj_le:
          $ref: '#/components/schemas/DateHeure'
        pages:
          type: array
          description: Toutes les pages, par position croissante (1, 2, 3… sans trou).
          items:
            type: object
            additionalProperties: false
            required: [position, bibliotheque, adresse, masquee, a_convertir]
            properties:
              position:
                type: integer
                minimum: 1
              bibliotheque:
                $ref: '#/components/schemas/IdentifiantBibliotheque'
              adresse:
                $ref: '#/components/schemas/AdressePage'
              masquee:
                type: boolean
                description: Vrai si la page contient un texte banni appliqué ; le public ne la voit pas.
              a_convertir:
                type: boolean

    DemandeCollection:
      type: object
      required: [nom]
      properties:
        nom:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        est_publique:
          type: boolean
          default: false

    ModificationCollection:
      type: object
      minProperties: 1
      properties:
        nom:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        est_publique:
          type: boolean

    DemandeAjoutPage:
      type: object
      required: [adresse]
      properties:
        bibliotheque:
          $ref: '#/components/schemas/IdentifiantBibliotheque'
        adresse:
          type: string
          description: L'adresse de page, contrôlée par `valider` (F5).
        position:
          type: integer
          minimum: 1
          description: Facultative. Au-delà de la dernière position + 1, `ERR_INVALID_PARAMETER`.

    DemandeOrdrePages:
      type: object
      required: [pages]
      properties:
        pages:
          type: array
          description: Toutes les pages de la collection, dans le nouvel ordre.
          items:
            $ref: '#/components/schemas/DemandePageDesignee'

    ListeMesCollections:
      type: object
      additionalProperties: false
      required: [lot, taille, total, elements]
      properties:
        lot:
          type: integer
          minimum: 1
        taille:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        elements:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ResumeMaCollection'

    # ---------------------------------------------------------------
    # Porte application : annotations
    # ---------------------------------------------------------------

    Annotation:
      type: object
      additionalProperties: false
      required: [id, bibliotheque, adresse, contenu, est_publique, masquee, a_convertir, auteur, est_a_moi, cree_le, maj_le]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        bibliotheque:
          $ref: '#/components/schemas/IdentifiantBibliotheque'
        adresse:
          $ref: '#/components/schemas/AdressePage'
        contenu:
          type: string
          minLength: 1
          maxLength: 2000
        est_publique:
          type: boolean
        masquee:
          type: boolean
          description: |
            Vrai si un administrateur l'a masquée (A4) ou si la page contient un texte banni
            appliqué. Seul l'auteur voit une annotation masquée.
        a_convertir:
          type: boolean
        auteur:
          $ref: '#/components/schemas/AuteurPublic'
        est_a_moi:
          type: boolean
          description: Vrai si le membre connecté en est l'auteur (il peut la modifier).
        cree_le:
          $ref: '#/components/schemas/DateHeure'
        maj_le:
          $ref: '#/components/schemas/DateHeure'

    DemandeAnnotation:
      type: object
      required: [adresse, contenu, est_publique]
      properties:
        bibliotheque:
          $ref: '#/components/schemas/IdentifiantBibliotheque'
        adresse:
          type: string
          description: L'adresse de page, contrôlée par `valider` (F5).
        contenu:
          type: string
          minLength: 1
          maxLength: 2000
        est_publique:
          type: boolean

    ModificationAnnotation:
      type: object
      minProperties: 1
      properties:
        contenu:
          type: string
          minLength: 1
          maxLength: 2000
        est_publique:
          type: boolean

    ListeAnnotations:
      type: object
      additionalProperties: false
      required: [lot, taille, total, elements]
      properties:
        lot:
          type: integer
          minimum: 1
        taille:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        elements:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Annotation'

    # ---------------------------------------------------------------
    # Porte application : signalements
    # ---------------------------------------------------------------

    CibleSignalement:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          type: string
          enum: [annotation, collection, lien_court]
        id:
          type: string
          description: L'identifiant de l'annotation ou de la collection, ou le slug du lien court.

    DemandeSignalement:
      type: object
      required: [cible, motif]
      properties:
        cible:
          $ref: '#/components/schemas/CibleSignalement'
        motif:
          type: string
          minLength: 1
          maxLength: 500

    Signalement:
      type: object
      additionalProperties: false
      required: [id, cible, motif, statut, cree_le]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        cible:
          $ref: '#/components/schemas/CibleSignalement'
        motif:
          type: string
        statut:
          type: string
          enum: [en_attente, traite, rejete]
          description: |
            `en_attente` tant qu'un administrateur ne l'a pas vu ; `traite` quand il a masqué
            ou rétabli le contenu ; `rejete` quand il a rejeté le signalement (A4).
        cree_le:
          $ref: '#/components/schemas/DateHeure'

    ListeSignalements:
      type: object
      additionalProperties: false
      required: [lot, taille, total, elements]
      properties:
        lot:
          type: integer
          minimum: 1
        taille:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        elements:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Signalement'

    # ---------------------------------------------------------------
    # Porte application : historique, import
    # ---------------------------------------------------------------

    RechercheEnregistree:
      type: object
      additionalProperties: false
      required: [id, texte, mode, portee, cree_le]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        texte:
          type: string
          minLength: 1
          maxLength: 3200
          description: Le texte normalisé, tel qu'il a été cherché.
        mode:
          $ref: '#/components/schemas/Mode'
        portee:
          type: string
          enum: [locale, reseau]
        cree_le:
          $ref: '#/components/schemas/DateHeure'

    ListeRecherches:
      type: object
      additionalProperties: false
      required: [lot, taille, total, elements]
      properties:
        lot:
          type: integer
          minimum: 1
        taille:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        elements:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/RechercheEnregistree'

    ResultatImport:
      type: object
      additionalProperties: false
      required: [importes, fusionnes, a_convertir]
      properties:
        importes:
          type: object
          additionalProperties: false
          required: [marque_pages, collections, annotations]
          properties:
            marque_pages:
              type: integer
              minimum: 0
            collections:
              type: integer
              minimum: 0
            annotations:
              type: integer
              minimum: 0
        fusionnes:
          type: integer
          minimum: 0
          description: Les marque-pages déjà présents, fusionnés au lieu d'être recréés (règle 20).
        a_convertir:
          type: integer
          minimum: 0
          description: Les adresses qui désignent une autre bibliothèque et seront converties en tâche de fond.

    EtatImport:
      type: object
      additionalProperties: false
      required: [a_convertir, derniere_tentative_le]
      properties:
        a_convertir:
          type: integer
          minimum: 0
          description: Les adresses importées qui désignent encore leur ancienne bibliothèque.
        derniere_tentative_le:
          $ref: '#/components/schemas/DateHeureOuNull'

    # ---------------------------------------------------------------
    # Erreurs
    # ---------------------------------------------------------------

    CodeErreur:
      type: string
      description: |
        Les codes d'erreur communs. Les sept premiers viennent du moteur ; les suivants
        complètent le livrable 2 dans le même style.

        | Code | Statut | Quand |
        | --- | --- | --- |
        | `ERR_INVALID_ADDRESS_SYNTAX` | 422 | adresse mal écrite (moteur, F5) |
        | `ERR_INVALID_HEX_CHARS` | 422 | hexagone avec un caractère interdit (moteur, F5) |
        | `ERR_OUT_OF_BOUNDS` | 404 si seul, sinon 422 | page inexistante (moteur, F5) |
        | `ERR_EMPTY_QUERY` | 422 | texte vide après normalisation (moteur) |
        | `ERR_TEXT_TOO_LONG` | 422 | texte de plus de 3 200 caractères (moteur) |
        | `ERR_UNKNOWN_MODE` | 422 | mode inconnu (moteur) |
        | `ERR_INVALID_PAGE_LENGTH` | 422 | mode `page` et texte qui ne fait pas 3 200 caractères (moteur) |
        | `ERR_INVALID_PARAMETER` | 422 | paramètre ou champ absent, mal écrit ou hors limites |
        | `ERR_NOT_FOUND` | 404 | ressource inconnue, privée, masquée ou d'un autre membre |
        | `ERR_UNKNOWN_LIBRARY` | 404 | bibliothèque absente de l'annuaire |
        | `ERR_SHORT_LINK_EXPIRED` | 410 | lien court expiré |
        | `ERR_UNAUTHENTICATED` | 401 | jeton de session absent ou invalide |
        | `ERR_INVALID_CREDENTIALS` | 401 | email ou mot de passe incorrect |
        | `ERR_INVALID_NETWORK_TOKEN` | 401 | jeton réseau absent ou faux |
        | `ERR_ACCOUNT_SUSPENDED` | 403 | compte suspendu (A2) |
        | `ERR_REGISTRATION_CLOSED` | 403 | inscriptions fermées (A8) |
        | `ERR_ALREADY_EXISTS` | 409 | doublon (email, marque-page, identifiant de recherche) |
        | `ERR_INVALID_IMPORT` | 422 | fichier d'import hors contrat (M12) |
        | `ERR_TOO_MANY_REQUESTS` | 429 | quota dépassé (A10) |
        | `ERR_PEER_UNREACHABLE` | 502 | pair éteint, trop lent ou hors contrat |
        | `ERR_PEER_BUSY` | 503 | pair qui a répondu `429` |

        Deux codes du livrable 2 ne sortent jamais en HTTP : `ERR_INVALID_ALPHABET` (le
        serveur normalise avant le moteur : s'il sort, c'est un oubli) et
        `ERR_LIBRARY_LIMIT` (calculé dans l'application web par `voisine`, qui désactive
        le bouton).
      enum:
        - ERR_INVALID_ADDRESS_SYNTAX
        - ERR_INVALID_HEX_CHARS
        - ERR_OUT_OF_BOUNDS
        - ERR_EMPTY_QUERY
        - ERR_TEXT_TOO_LONG
        - ERR_UNKNOWN_MODE
        - ERR_INVALID_PAGE_LENGTH
        - ERR_INVALID_PARAMETER
        - ERR_NOT_FOUND
        - ERR_UNKNOWN_LIBRARY
        - ERR_SHORT_LINK_EXPIRED
        - ERR_UNAUTHENTICATED
        - ERR_INVALID_CREDENTIALS
        - ERR_INVALID_NETWORK_TOKEN
        - ERR_ACCOUNT_SUSPENDED
        - ERR_REGISTRATION_CLOSED
        - ERR_ALREADY_EXISTS
        - ERR_INVALID_IMPORT
        - ERR_TOO_MANY_REQUESTS
        - ERR_PEER_UNREACHABLE
        - ERR_PEER_BUSY

    Erreur:
      type: object
      additionalProperties: false
      required: [code, champ, message]
      properties:
        code:
          $ref: '#/components/schemas/CodeErreur'
        champ:
          type: [string, 'null']
          description: |
            Le champ concerné : `adresse`, `hexagone`, `mur`, `etagere`, `volume`, `page`,
            `texte`, `mode`, `bibliotheque`, `id`, `lot`, `taille`, `email`… ou `null`
            quand l'erreur ne porte sur aucun champ.
        message:
          type: string
          minLength: 1
          description: Une phrase lisible, en français. Libre, non comparée par le testeur.

    ReponseErreur:
      type: object
      additionalProperties: false
      required: [erreurs]
      properties:
        erreurs:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Erreur'

    # ---------------------------------------------------------------
    # Fichier d'export
    # ---------------------------------------------------------------

    ExportCompte:
      type: object
      additionalProperties: false
      description: |
        **Le fichier d'export d'un compte** (M11), lu par l'import d'une autre bibliothèque
        (M12). Son format fait partie du contrat commun.

        - Chaque adresse est accompagnée de l'identifiant de sa bibliothèque.
        - Le mot de passe n'y figure pas, même haché.
        - L'import ne recrée que les marque-pages, les collections et les annotations,
          qui arrivent privées. Le reste est informatif.
        - Un fichier qui ne respecte pas ce schéma est refusé en entier (`ERR_INVALID_IMPORT`).
      required: [format, exporte_le, bibliotheque, profil, marque_pages, collections, annotations, votes, recherches, liens_courts]
      properties:
        format:
          type: string
          const: babel-export/v1
        exporte_le:
          $ref: '#/components/schemas/DateHeure'
        bibliotheque:
          $ref: '#/components/schemas/IdentifiantBibliotheque'
          description: La bibliothèque qui a produit le fichier.
        profil:
          type: object
          additionalProperties: false
          required: [pseudo, email, cree_le]
          properties:
            pseudo:
              type: string
              minLength: 1
            email:
              type: string
              format: email
            cree_le:
              $ref: '#/components/schemas/DateHeure'
        marque_pages:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [bibliotheque, adresse, titre, cree_le]
            properties:
              bibliotheque:
                $ref: '#/components/schemas/IdentifiantBibliotheque'
              adresse:
                $ref: '#/components/schemas/AdressePage'
              titre:
                type: [string, 'null']
              cree_le:
                $ref: '#/components/schemas/DateHeure'
        collections:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [nom, description, est_publique, pages, cree_le]
            properties:
              nom:
                type: string
                minLength: 1
              description:
                type: string
              est_publique:
                type: boolean
                description: L'état chez l'ancienne bibliothèque. À l'import, la collection arrive privée.
              pages:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [position, bibliotheque, adresse]
                  properties:
                    position:
                      type: integer
                      minimum: 1
                    bibliotheque:
                      $ref: '#/components/schemas/IdentifiantBibliotheque'
                    adresse:
                      $ref: '#/components/schemas/AdressePage'
              cree_le:
                $ref: '#/components/schemas/DateHeure'
        annotations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [bibliotheque, adresse, contenu, est_publique, cree_le, maj_le]
            properties:
              bibliotheque:
                $ref: '#/components/schemas/IdentifiantBibliotheque'
              adresse:
                $ref: '#/components/schemas/AdressePage'
              contenu:
                type: string
                minLength: 1
                maxLength: 2000
              est_publique:
                type: boolean
              cree_le:
                $ref: '#/components/schemas/DateHeure'
              maj_le:
                $ref: '#/components/schemas/DateHeure'
        votes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [bibliotheque, adresse, valeur, cree_le]
            properties:
              bibliotheque:
                $ref: '#/components/schemas/IdentifiantBibliotheque'
              adresse:
                $ref: '#/components/schemas/AdressePage'
              valeur:
                type: integer
                enum: [1, -1]
              cree_le:
                $ref: '#/components/schemas/DateHeure'
        recherches:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [texte, mode, portee, cree_le]
            properties:
              texte:
                type: string
              mode:
                $ref: '#/components/schemas/Mode'
              portee:
                type: string
                enum: [locale, reseau]
              cree_le:
                $ref: '#/components/schemas/DateHeure'
        liens_courts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [slug, cible, passage, visites, expire_le, cree_le]
            properties:
              slug:
                type: string
              cible:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required: [type, bibliotheque, adresse]
                    properties:
                      type:
                        const: adresse
                      bibliotheque:
                        $ref: '#/components/schemas/IdentifiantBibliotheque'
                      adresse:
                        $ref: '#/components/schemas/AdresseCible'
                  - type: object
                    additionalProperties: false
                    required: [type, collection]
                    properties:
                      type:
                        const: collection
                      collection:
                        type: integer
                        minimum: 0
                        description: L'indice de la collection dans le tableau `collections` de ce fichier, à partir de 0.
              passage:
                type: [string, 'null']
                description: Le texte à surligner, seulement pour une cible page.
              visites:
                type: integer
                minimum: 0
              expire_le:
                $ref: '#/components/schemas/DateHeureOuNull'
              cree_le:
                $ref: '#/components/schemas/DateHeure'
