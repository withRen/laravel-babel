        '401':
          $ref: '#/components/responses/NonConnecte'
        '404':
          $ref: '#/components/responses/Introuvable'

  # ------------------------------------------------------------------
  # Porte application : signalements
  # ------------------------------------------------------------------

  /app/signalements:
    post:
      tags: [Signalements]
      operationId: signaler
      summary: Signaler un contenu publié
      description: |
        Signale une annotation publique, une collection publique ou un lien court de cette
        bibliothèque (V17). Ouvert aux visiteurs. On ne signale jamais une page (livrable 1).

        - Un visiteur garde lui-même, dans son navigateur, la liste de ce qu'il a signalé
          pour ne plus le voir (V18).
        - Un membre qui signale deux fois le même contenu reçoit son signalement existant
          (`200`), pas un doublon.
        - Le contenu d'une autre bibliothèque relève de sa modération : il ne se signale
          pas ici.
      security:
        - {}
        - jetonMembre: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemandeSignalement'
            examples:
              annotation:
                value:
                  cible:
                    type: annotation
                    id: '7'
                  motif: Propos insultants.
      responses:
        '200':
          description: Ce membre avait déjà signalé ce contenu ; voici son signalement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Signalement'
        '201':
          description: Le signalement est enregistré.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Signalement'
        '404':
          $ref: '#/components/responses/Introuvable'
        '422':
          $ref: '#/components/responses/ParametreRefuse'
        '429':
          $ref: '#/components/responses/TropDeRequetes'

  /app/moi/signalements:
    get:
      tags: [Signalements]
      operationId: listerMesSignalements
      summary: Mes signalements
      description: |
        Les signalements du membre (V18) : l'application web retire ces contenus de ce
        qu'elle lui montre, quelle que soit la décision de l'administrateur. La liste se
        déduit de `SIGNALEMENT` (règle 15).
      security:
        - jetonMembre: []
      parameters:
        - $ref: '#/components/parameters/Lot'
        - $ref: '#/components/parameters/Taille'
      responses:
        '200':
          description: Un lot de signalements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListeSignalements'
        '401':
          $ref: '#/components/responses/NonConnecte'
        '422':
          $ref: '#/components/responses/ParametreRefuse'

