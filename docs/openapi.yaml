  # Porte application : bibliothèque et réseau
  # ------------------------------------------------------------------

  /app/infos:
    get:
      tags: [Bibliothèque et réseau]
      operationId: lireInfos
      summary: Configuration de la bibliothèque
      description: |
        Tout ce dont l'application web a besoin au démarrage : l'identité de la
        bibliothèque (page « À propos », V20 ; nom et description, A8), l'état des
        inscriptions (V19), les constantes de la bibliothèque (pour `voisine`, F6, et le
        contrôle des saisies), les limites appliquées par le serveur et les paramètres
        du temps réel.

        Les constantes sont les mêmes dans les 10 bibliothèques : elles viennent du moteur
        (`Moteur::ALPHABET`, `Moteur::LONGUEUR_PAGE`…). `dernier_hexagone` est le nom du
        dernier hexagone, qui ne contient que la page `w1-s1-v1:1`.
      security:
        - {}
        - jetonMembre: []
      responses:
        '200':
          description: La configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Infos'
        '429':
          $ref: '#/components/responses/TropDeRequetes'

  /app/bibliotheques:
    get:
      tags: [Bibliothèque et réseau]
      operationId: listerBibliotheques
      summary: Bibliothèques du réseau
      description: |
        Les bibliothèques que votre serveur connaît, la vôtre comprise (`est_locale`),
        avec leur état (A9, vue publique). L'application web s'en sert pour choisir une
        bibliothèque où ouvrir une adresse (V16), parcourir le réseau (V21), afficher
        le bilan d'une recherche réseau (V15) et nommer la bibliothèque d'un marque-page
        (M13).

        Cette liste vient de l'annuaire et du contrôle régulier des pairs fait en tâche
        de fond. Elle ne déclenche aucun appel réseau.
      security:
        - {}
        - jetonMembre: []
      responses:
        '200':
          description: Les bibliothèques, la locale en premier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListeBibliotheques'
              examples:
                deux:
                  value:
                    elements:
                      - identifiant: exemple
                        nom: La bibliothèque d'exemple
                        description: Une bibliothèque de démonstration.
                        est_locale: true
                        etat: en_ligne
                        dernier_contact_le: null
                        cle_changee_le: null
                        application_web: http://localhost:4200
                      - identifiant: voisine
                        nom: La bibliothèque voisine
                        description: ''
                        est_locale: false
                        etat: hors_ligne
                        dernier_contact_le: '2026-11-20T13:58:00+01:00'
                        cle_changee_le: null
                        application_web: null
        '429':
          $ref: '#/components/responses/TropDeRequetes'

