name: CI

# Se déclenche à chaque push et à chaque pull request.
on:
  push:
  pull_request:

# Si on repousse sur la même branche, on annule l'exécution précédente (gain de temps).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Droits minimaux : le workflow ne fait que lire le dépôt.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      # PHP 8.3 avec l'extension gmp, exigée par le moteur Babel.
      - name: Installer PHP 8.3 (avec gmp)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gmp, mbstring, pdo_sqlite, sqlite3, intl, bcmath
          tools: composer:v2
          coverage: none

      - name: Trouver le dossier de cache Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      # Le cache est relié au contenu de composer.lock : il est renouvelé quand les dépendances changent.
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # Le .env doit exister avant l'installation (les scripts Composer démarrent Laravel).
      - name: Préparer le .env
        run: cp .env.example .env

      - name: Installer les dépendances
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Générer la clé d'application Laravel
        run: php artisan key:generate

      # Clé de test, jetable : générée dans le job, jamais commitée, sans rapport avec la vraie clé de l'équipe.
      - name: Générer une BABEL_KEY de test
        run: php artisan babel:cle

      - name: Vérifier le moteur Babel
        run: php artisan babel:verifier

      - name: Style du code (Pint)
        run: vendor/bin/pint --test

      - name: Tests (Pest)
        run: vendor/bin/pest

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Node LTS ; le cache npm est relié à package-lock.json.
      - name: Installer Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances (npm ci)
        run: npm ci

      - name: Build
        run: npm run build

      # --no-watch : sinon le runner reste en attente de modifications et ne termine jamais.
      - name: Tests
        run: npm test -- --no-watch
